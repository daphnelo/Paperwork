function init() {
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (_) { /* 忽略 */ }
  let raw = {};
  try { raw = JSON.parse(($('#notes-data').textContent || '').trim() || '{}'); } catch (_) { raw = {}; }
  data = ensureShape(raw);
  loadedUpdatedAt = data.updatedAt || 0;
  const draft = readDraft();
  if (draft && draft.data && Array.isArray(draft.data.tree) && (draft.data.updatedAt || 0) > (data.updatedAt || 0)) {
    if (confirm('偵測到瀏覽器中有較檔案內容更新的暫存版本（' + new Date(draft.savedAt).toLocaleString() + '）。\n是否還原該暫存版本？')) {
      data = ensureShape(draft.data);
      dirty = true;
    } else clearDraft();
  }
  applyFontVars();
  checkFonts();
  applyUI();
  positionDrawer();
  computeCardNos();
  const id = (data.activeId && data.notes[data.activeId]) ? data.activeId : firstNoteId();
  if (id) loadNote(id); else showEmptyState();
  renderTree();
  renderStickies();
  updateTrashBar();
  fileName = defaultFileName();
  if (dirty) setStatus('dirty', '已還原暫存（按 Ctrl+S 寫入檔案）');
  else setStatus('ready', '已就緒');
  if (!PW_MODE) restoreHandle();
  const relayout = () => { PAGE_H = 0; layoutAllTrees(); reflowAll(); scheduleLayout(); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  window.addEventListener('load', relayout);
}

/* Paperwork integration. Exported file:// notebooks retain the original standalone behavior. */
const PW_MODE = /^https?:$/.test(location.protocol) && parent !== window && !!parent.PaperworkBrowser;
let pwRevision = '0', pwToken = '', pwPath = '', pwSaving = null, pwPending = false;
let pwLoaded = false, pwConflict = false;

function pwNotify(state, text) {
  if (PW_MODE && window.parent !== window) window.parent.postMessage({type: 'paperwork-editor-status', state, text, dirty, path: pwPath}, location.origin);
}
async function pwRequest(path, body) {
  const response = await parent.PaperworkBrowser.fetch(path, {method: body === undefined ? 'GET' : 'POST', credentials: 'same-origin', cache: 'no-store',
    headers: body === undefined ? {} : {'Content-Type': 'application/json', 'X-Local-Token': pwToken},
    body: body === undefined ? undefined : JSON.stringify(body)});
  const result = await response.json();
  if (!response.ok) {
    const error = new Error(result.error || '本地筆記庫讀寫失敗'); error.status = response.status; throw error;
  }
  return result;
}
function pwSave() {
  if (!pwLoaded) return Promise.resolve(false);
  if (pwSaving) { pwPending = true; return pwSaving; }
  pwSaving = (async () => {
    try {
      if (pwConflict) throw new Error('另一個視窗已更新筆記庫。請先「匯出 HTML」保留本頁內容，再重新整理並匯入。');
      do {
        pwPending = false;
        commitCurrent(); saveDraft();
        const seq = editSeq;
        const snapshot = JSON.parse(JSON.stringify(data));
        setStatus('saving', '正在儲存到 Paperwork…');
        const result = await pwRequest('/api/notebook', {revision: pwRevision, data: snapshot});
        pwRevision = result.revision; pwPath = result.path;
        if (seq === editSeq) { dirty = false; clearDraft(); }
        else pwPending = true;
        setStatus(result.warning ? 'error' : dirty ? 'dirty' : 'saved', result.warning || (dirty ? '正在儲存後續變更…' : '已儲存 · ' + result.path + ' · ' + nowHMS()));
      } while (pwPending);
      return true;
    } catch (error) {
      if (error.status === 409) pwConflict = true;
      dirty = true; commitCurrent(); saveDraft();
      setStatus('error', error.message + '（可先匯出 HTML 保留內容）');
      return false;
    } finally { pwSaving = null; }
  })();
  return pwSaving;
}
function pwExport() {
  commitCurrent(); saveDraft();
  downloadBlob(new Blob([serializeDocument()], {type: 'text/html'}), 'Paperwork筆記庫.html');
  toast('已匯出完整 HTML 筆記庫，可獨立開啟編輯');
}
async function pwImportReport(report) {
  await window.PaperworkEditor.ready;
  if (!report || typeof report.jobId !== 'string' || typeof report.html !== 'string' || typeof report.title !== 'string') throw new Error('報告內容不完整');
  commitCurrent();
  const existing = Object.keys(data.notes).find(id => data.notes[id].paperworkJobId === report.jobId && findNode(id));
  if (existing) {
    switchNote(existing); scheduleReflow();
    return {existing: true, id: existing};
  }
  // Only the parent's safely rendered report markup is admitted; no scripts, links or event handlers.
  const template = document.createElement('template'); template.innerHTML = report.html;
  const allowed = new Set(['H1','H2','H3','H4','H5','H6','P','STRONG','EM','CODE','PRE','UL','OL','LI','TABLE','THEAD','TBODY','TR','TH','TD','BR','BLOCKQUOTE']);
  for (const node of [...template.content.querySelectorAll('*')]) {
    if (!allowed.has(node.tagName)) { node.replaceWith(document.createTextNode(node.textContent)); continue; }
    for (const attr of [...node.attributes]) node.removeAttribute(attr.name);
    if (node.tagName === 'TABLE') node.className = 'doc-table';
    if (node.tagName === 'BLOCKQUOTE') {
      const paragraph = document.createElement('p'); paragraph.className = 'quote';
      paragraph.append(...node.childNodes); node.replaceWith(paragraph);
    }
  }
  let folder = data.tree.find(node => node.type === 'folder' && node.paperworkInbox);
  if (!folder) { folder = {id: uid('folder'), type: 'folder', name: 'Gemini 分析筆記', open: true, children: [], paperworkInbox: true}; data.tree.push(folder); }
  folder.open = true;
  const id = uid('note');
  data.notes[id] = {html: pageHTML(template.innerHTML), comments: {}, outline: false, paperworkJobId: report.jobId};
  folder.children.push({id, type: 'note', name: report.title});
  data.ui.sideTab = 'notes';
  loadNote(id); renderTree(); markDirty();
  clearTimeout(autoTimer);
  if (!await pwSave()) throw new Error('內容已送入編輯器，但本機存檔未成功；請查看上方存檔狀態。');
  return {existing: false, id};
}
async function pwBoot() {
  document.body.inert = true;
  try {
    const [state, notebook] = await Promise.all([pwRequest('/api/state'), pwRequest('/api/notebook')]);
    pwToken = state.token; pwRevision = notebook.revision; pwPath = notebook.path;
    if (notebook.data) $('#notes-data').textContent = JSON.stringify(notebook.data).replace(/</g, '\\u003c');
    init();
    pwLoaded = true;
    $('#btn-open').textContent = '匯入 HTML';
    $('#btn-open').title = '合併既有 HTML 筆記庫，保留目前筆記';
    $('#btn-saveas').textContent = '匯出 HTML';
    $('#btn-saveas').title = '下載包含所有筆記的獨立 HTML 編輯器';
    $('#btn-save').title = '儲存到 Paperwork 本地筆記庫（Ctrl+S）';
    if (!notebook.data || dirty) await pwSave();
    else setStatus('saved', '已載入此瀏覽器的筆記庫 · 變更會自動儲存');
  } finally { document.body.inert = false; }
}

function pwSanitizeReport(html, jobId) {
  const template = document.createElement('template'); template.innerHTML = html;
  const allowed = new Set(['H1','H2','H3','H4','H5','H6','P','STRONG','EM','CODE','PRE','UL','OL','LI','TABLE','THEAD','TBODY','TR','TH','TD','BR','BLOCKQUOTE']);
  for (const node of [...template.content.querySelectorAll('*')]) {
    if (!allowed.has(node.tagName)) { node.replaceWith(document.createTextNode(node.textContent)); continue; }
    const level = node.tagName === 'H6' && /^[789]$/.test(node.dataset.lv || '') ? node.dataset.lv : null;
    for (const attr of [...node.attributes]) node.removeAttribute(attr.name);
    if (level) node.dataset.lv = level;
    if (node.tagName === 'TABLE') node.className = 'doc-table';
    if (node.tagName === 'BLOCKQUOTE') { const p = document.createElement('p'); p.className = 'quote'; p.append(...node.childNodes); node.replaceWith(p); }
  }
  for (const node of template.content.children) node.dataset.pwJob = jobId;
  return template;
}
async function pwImportPaper(report) {
  await window.PaperworkEditor.ready;
  commitCurrent();
  const prior = Object.keys(data.notes).find(id => data.notes[id].paperworkImports?.[report.jobId] && findNode(id));
  let id = prior;
  if (!id) {
    const template = pwSanitizeReport(report.html, report.jobId);
    if (report.options?.mode === 'insert') {
      id = report.options.target_id;
      if (!data.notes[id] || !findNode(id)) throw new Error('原本指定的筆記已不存在。摘要仍保留在分析記錄，可選「另建新筆記」。');

      const marker = [...pagesEl.querySelectorAll('[data-paper-insert]')].find(el => el.dataset.paperInsert === report.options.marker);
      if (marker) {
        const block = marker.closest('p,h1,h2,h3,h4,h5,h6');
        if (block && block.closest('.page-body')) {
          const range = document.createRange(); range.setStartAfter(marker); range.setEnd(block, block.childNodes.length);
          const tail = block.cloneNode(false); tail.append(range.extractContents()); marker.remove();
          block.after(template.content, tail);

        pagesEl.querySelector('.a4-page:last-child .page-body').append(template.content);
        toast('原插入位置已變更，摘要已接續在指定筆記文末。', 5000);
      }
    } else {
      let folder = data.tree.find(n => n.type === 'folder' && n.paperworkInbox);
      if (!folder) { folder = {id: uid('folder'), type: 'folder', name: 'Gemini 分析筆記', open: true, children: [], paperworkInbox: true}; data.tree.push(folder); }
      folder.open = true; id = uid('note');
      data.notes[id] = {html: pageHTML(template.innerHTML), comments: {}, outline: false};
      folder.children.push({id, type: 'note', name: report.title}); loadNote(id);
    }
    if (!data.notes[id].paperworkImports) data.notes[id].paperworkImports = {};
    data.notes[id].paperworkImports[report.jobId] = {title: report.title, concepts: report.concepts || [], cards: {}};
    data.ui.sideTab = 'notes'; data.ui.navOpen = true; applyUI(); renderTree();
    markDirty(); commitCurrent(); scheduleReflow();
    if (!await pwSave()) throw new Error('摘要已載入，但本機存檔未成功，請先查看存檔狀態。');
  } else switchNote(id);
  pwConceptPanel(id, report.jobId);
  return {existing: !!prior, id};
}

function pwBindBadge(jobId, card) {
  const roots = [...pagesEl.querySelectorAll('[data-pw-job]')].filter(node => node.dataset.pwJob === jobId);
  const blockSelector = 'p,h1,h2,h3,h4,h5,h6,li,td,th,pre';
  const blocks = [...new Set(roots.flatMap(root => root.matches(blockSelector) ? [root] : [...root.querySelectorAll(blockSelector)]))];
  // A word may span inline formatting, but must not match across paragraphs or hidden objects.
  for (const block of blocks) {
    let text = '', segments = [];
    const walk = node => {
      if (node.nodeType === Node.TEXT_NODE) {
        segments.push({node, start: text.length, end: text.length + node.textContent.length});
        text += node.textContent; return;
      }
      if (node.nodeType !== Node.ELEMENT_NODE) return;
      if (node !== block && (node.matches(blockSelector + ',br,.card-badge,.ol-num,sup,.math,[contenteditable="false"]'))) {
        text += '\u0000'; return;
      }
      node.childNodes.forEach(walk);
    };
    walk(block);
    const offset = card.title ? text.indexOf(card.title) : -1;
    if (offset < 0) continue;
    const end = offset + card.title.length;
    const segment = segments.find(s => s.start < end && end <= s.end);
    if (!segment) continue;
    const range = document.createRange(); range.setStart(segment.node, end - segment.start); range.collapse(true);
    insertBadge(range, card); return;
  }
  // Legacy report blocks may contain bare text without a paragraph wrapper.
  for (const root of roots) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if (node.parentElement.closest('.card-badge,.ol-num,sup,.math,[contenteditable="false"]') || node.parentElement.closest(blockSelector)) continue;
      const offset = node.textContent.indexOf(card.title);
      if (offset < 0) continue;
      const range = document.createRange(); range.setStart(node, offset + card.title.length); range.collapse(true); insertBadge(range, card); return;
    }
  }
  const p = document.createElement('p'); p.dataset.pwJob = jobId; p.textContent = '相關概念：' + card.title;
  if (roots.length) roots.at(-1).after(p);
  else pagesEl.querySelector('.page-body').append(p);
  const range = document.createRange(); range.selectNodeContents(p); range.collapse(false); insertBadge(range, card);
}

  const button = $('#btn-paper-import');
  button.textContent = event.data.busy ? '✦ Gemini · 分析中' : '✦ Gemini';
  button.title = event.data.busy ? '查看分析進度；你仍可繼續編輯' : event.data.configured ? 'Gemini 已連線：文件分析、論文摘要與設定' : '連接 Gemini，將文件分析帶回筆記';
});

if (PW_MODE) {
  window.PaperworkEditor = {
    ready: null, importReport: pwImportReport, importPaper: pwImportPaper, captureTarget: pwCaptureTarget, cancelTarget: pwCancelTarget, save: pwSave,
    exportHTML() { commitCurrent(); return serializeDocument(); },
    captureDraft() { if (pwLoaded && dirty) { commitCurrent(); saveDraft(); } },
    refreshLayout() { if (pwLoaded) { window.dispatchEvent(new Event('resize')); scheduleReflow(); } }
  };
  window.PaperworkEditor.ready = pwBoot();
  window.PaperworkEditor.ready.catch(error => {
    $('#toolbar').hidden = true; $('#app').hidden = true;
    const box = document.createElement('div'); box.style.cssText = 'padding:48px;font:16px/1.8 sans-serif';
    box.setAttribute('role', 'alert');
    box.append(document.createTextNode('無法載入本地筆記庫：' + error.message));
    const retry = document.createElement('button'); retry.textContent = '重新載入'; retry.onclick = () => location.reload();
    box.append(document.createElement('br'), retry); document.body.append(box);
    pwNotify('error', error.message);
  });
} else init();

})();
</script>
</body>
</html>
