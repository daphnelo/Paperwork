}

function tableOp(op) {
  const cell = currentCell() || (cellSel && cellSel.cells[0]);
  if (!cell) { toast('請先將游標置於表格內'); return; }
  const table = cell.closest('table');
  const { grid, info, ncol } = buildGrid(table);
  const inf = info.get(cell);
  const rows = [...table.rows];
  let ws = colWidths(table);
  let wsChanged = false;
  let focus = cell;

  if (op === 'row-above' || op === 'row-below') {
    const above = op === 'row-above';
    const R = above ? inf.r0 : inf.r0 + inf.rs - 1;
    const tr = document.createElement('tr');
    const seen = new Set();
    for (let c = 0; c < ncol;) {
      const x = grid[R] && grid[R][c];
      if (!x) { tr.appendChild(newCell('TD', 1)); c++; continue; }
      const xi = info.get(x);
      const across = above ? xi.r0 < R : (xi.r0 + xi.rs - 1) > R;
      if (across) { if (!seen.has(x)) { x.rowSpan = xi.rs + 1; seen.add(x); } }
      else tr.appendChild(newCell(x.tagName, xi.cs));
      c += xi.cs;
    }
    if (above) rows[R].before(tr); else rows[R].after(tr);

  } else if (op === 'col-left' || op === 'col-right') {
    const C = op === 'col-left' ? inf.c0 : inf.c0 + inf.cs;
    const seen = new Set();
    rows.forEach((tr, r) => {
      const x = C < ncol ? grid[r] && grid[r][C] : null;
      if (x) {
        const xi = info.get(x);
        if (xi.c0 < C) { if (!seen.has(x)) { x.colSpan = xi.cs + 1; seen.add(x); } return; }
      }
      const td = newCell('TD', 1);
      const ref = [...tr.cells].find(y => info.get(y).c0 >= C);
      if (ref) tr.insertBefore(td, ref); else tr.appendChild(td);
    });
    const refIdx = op === 'col-left' ? Math.min(C, ncol - 1) : C - 1;
    const half = ws[refIdx] / 2;
    ws[refIdx] = half;
    ws.splice(C, 0, half);
    wsChanged = true;
    const g2 = buildGrid(table);
    focus = (g2.grid[inf.r0] && g2.grid[inf.r0][C]) || cell;
  } else if (op === 'row-del') {
    if (rows.length <= 1) { tableOp('table-del'); return; }
    const R = inf.r0;
    const seen = new Set();
    for (let c = 0; c < ncol;) {
      const x = grid[R] && grid[R][c];
      if (!x) { c++; continue; }
      const xi = info.get(x);
      if (!seen.has(x)) {
        seen.add(x);
        if (xi.r0 < R) x.rowSpan = xi.rs - 1;
        else if (xi.rs > 1 && rows[R + 1]) {

          const nextTr = rows[R + 1];
          const ref = [...nextTr.cells].find(y => info.get(y).c0 > xi.c0);
          if (ref) nextTr.insertBefore(x, ref); else nextTr.appendChild(x);
        }

      c += xi.cs;
    }
    const nb = rows[R + 1] || rows[R - 1];

    if (ncol <= 1) { tableOp('table-del'); return; }

    const tl = grid[r1][c1];
    const hasContent = x => x.textContent.trim() || x.querySelector('img,.card-badge,sup,.comment-target');
    cellSel.cells.forEach(x => {
      if (x === tl) return;
      if (hasContent(x)) {
        if (!hasContent(tl)) tl.innerHTML = '';
        else tl.appendChild(document.createElement('br'));
        while (x.firstChild) tl.appendChild(x.firstChild);
      }
      x.remove();
    });
    tl.rowSpan = r2 - r1 + 1;
    tl.colSpan = c2 - c1 + 1;
    clearCellSel();
    focus = tl;
  } else if (op === 'split') {
    if (inf.rs === 1 && inf.cs === 1) { toast('此儲存格未合併'); return; }
    for (let r = inf.r0; r < inf.r0 + inf.rs; r++) {
      const tr = table.rows[r]; if (!tr) continue;
      const n = r === inf.r0 ? inf.cs - 1 : inf.cs;
      const ref = [...tr.cells].find(y => y !== cell && info.get(y) && info.get(y).c0 > inf.c0);
      for (let k = 0; k < n; k++) { const td = newCell(cell.tagName, 1); if (ref) tr.insertBefore(td, ref); else tr.appendChild(td); }
    }
    cell.rowSpan = 1; cell.colSpan = 1;
  } else if (op === 'shade') {
    const cells = cellSel ? cellSel.cells : [cell];
    const on = !cells.every(c => c.style.backgroundColor);
    cells.forEach(c => { c.style.backgroundColor = on ? '#F2F2F2' : ''; if (!c.getAttribute('style')) c.removeAttribute('style'); });
  } else if (op === 'table-del') {
    deleteBlock(table);
    return;
  }
  if (wsChanged) rebuildColgroup(table, ws); else ensureColgroup(table);
  if (op !== 'shade') clearCellSel();
  if (focus && focus.isConnected) placeCaret(focus, false);
  markDirty(); scheduleLayout(); updateCtxBar();
}

let colDrag = null, hoverBoundary = null, selAnchor = null, selecting = false;
pagesEl.addEventListener('mousemove', e => {

function layoutAllTrees() { pagesEl.querySelectorAll('.tree-diagram').forEach(layoutTree); }
function relayoutTreeAtSelection() {

function layoutTree(wrap) {
  const rootEl = wrap.querySelector(':scope > .td-node');
  if (!rootEl) return;
  if (!wrap.querySelector(':scope > .td-lines')) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('class', 'td-lines');
    wrap.prepend(s);
  }
  const svg = wrap.querySelector(':scope > .td-lines');
  const orient = wrap.dataset.orient === 'v' ? 'v' : 'h';
  const W = Math.max(60, wrap.clientWidth || 500);
  const fs = parseFloat(getComputedStyle(wrap).fontSize) || 10.67;
  let LG = Math.max(14, Math.round(fs * 2.2));
  let SG = Math.max(4, Math.round(fs * (orient === 'h' ? 0.7 : 1)));
  const NG = 2;
  const MAXW = Math.round(fs * 16), MINW = Math.round(fs * 3 + 14), HARDMIN = Math.round(fs * 1.1 + 14);
  const all = [];
  const walk = (el, depth) => {
    const box = el.querySelector(':scope > .td-box');
    let note = el.querySelector(':scope > .td-note');
    if (note && !note.textContent.trim() && document.activeElement !== note && !note.querySelector('img,.card-badge')) { note.remove(); note = null; }
    const kc = el.querySelector(':scope > .td-children');
    const n = { el, box, note, depth, kids: [] };
    all.push(n);
    if (kc) n.kids = [...kc.children].filter(c => c.classList.contains('td-node') && c.querySelector(':scope > .td-box')).map(c => walk(c, depth + 1));
    return n;
  };
  const root = walk(rootEl, 0);
  all.forEach(n => {
    const s = n.box.style; s.paddingTop = ''; s.paddingBottom = ''; s.width = 'max-content'; s.left = '0px'; s.top = '0px';
    s.minHeight = n.box.dataset.h ? n.box.dataset.h + 'px' : '';
    if (n.note) { n.note.style.width = '10px'; n.note.style.left = '0px'; n.note.style.top = '0px'; }
  });
  all.forEach(n => {
    const uw = parseFloat(n.box.dataset.w);
    n.nat = uw ? Math.max(HARDMIN, Math.min(W, uw)) : Math.min(MAXW, Math.max(MINW, Math.ceil(n.box.getBoundingClientRect().width / ZOOM) + 1));
  });
  const L = Math.max(...all.map(n => n.depth)) + 1;
  const place = (n, start) => {
    if (!n.kids.length) { n.b = start; return start + n.bsize; }
    let cur = start;
    n.kids.forEach((k, i) => { if (i) cur += SG; cur = place(k, cur); });
    const f = n.kids[0], l = n.kids[n.kids.length - 1];
    const anchorOf = k => orient === 'h' ? k.b + (k.hb || k.bsize) / 2 : k.b + k.bsize / 2;
    const c = (anchorOf(f) + anchorOf(l)) / 2;
    n.b = orient === 'h' ? c - (n.hb || n.bsize) / 2 : c - n.bsize / 2;
    if (n.b < start) {
      const d = start - n.b;
      const shift = m => { m.b += d; m.kids.forEach(shift); };
      n.kids.forEach(shift);
      n.b = start; cur += d;
    }
    return Math.max(cur, n.b + n.bsize);
  };
  const setW = (n, w) => { n.w = w; n.box.style.width = w + 'px'; if (n.note) n.note.style.width = w + 'px'; };
  const measure = n => { n.hb = n.box.offsetHeight; n.hn = n.note ? n.note.offsetHeight : 0; n.h = n.hb + (n.note ? NG + n.hn : 0); };
  let totalW, totalH;
  if (orient === 'h') {
    const levelNat = Array(L).fill(0);
    all.forEach(n => { levelNat[n.depth] = Math.max(levelNat[n.depth], n.nat); });
    const sumW = (c, min) => levelNat.reduce((s, v) => s + Math.max(min, Math.min(v, c)), 0);
    let widths = levelNat.slice();
    if (sumW(Infinity, MINW) + LG * (L - 1) > W) {
      if (sumW(MINW, MINW) + LG * (L - 1) > W) LG = Math.max(8, Math.floor((W - sumW(MINW, MINW)) / Math.max(1, L - 1)));
      const avail = W - LG * (L - 1);
      if (sumW(MINW, MINW) <= avail) {
        let lo = MINW, hi = Math.max(...levelNat);
        for (let i = 0; i < 24; i++) { const mid = (lo + hi) / 2; if (sumW(mid, MINW) <= avail) lo = mid; else hi = mid; }
        widths = levelNat.map(v => Math.floor(Math.max(MINW, Math.min(v, lo))));
      } else {
        const s = avail / sumW(MINW, MINW);
        widths = levelNat.map(v => Math.max(HARDMIN, Math.floor(Math.min(v, MINW) * s)));
      }
    }
    all.forEach(n => setW(n, widths[n.depth]));
    all.forEach(n => { measure(n); n.bsize = n.h; });
    const xs = []; let x = 0;
    for (let d = 0; d < L; d++) { xs[d] = x; x += widths[d] + LG; }
    totalW = x - LG;
    totalH = place(root, 0);
    const ox = Math.max(0, Math.round((W - totalW) / 2));
    all.forEach(n => { n.x = ox + xs[n.depth]; n.y = n.b; });
  } else {
    const setCap = (c, min) => all.forEach(n => { n.bsize = Math.floor(Math.max(min, Math.min(n.nat, c))); n.hb = 0; });
    setCap(Infinity, MINW);
    let total = place(root, 0);
    if (total > W) {
      let lo = MINW, hi = MAXW;
      for (let i = 0; i < 24; i++) { const mid = (lo + hi) / 2; setCap(mid, MINW); if (place(root, 0) <= W) lo = mid; else hi = mid; }
      setCap(lo, MINW); total = place(root, 0);
      if (total > W) { SG = 4; total = place(root, 0); }
      if (total > W) {
        let lo2 = HARDMIN, hi2 = MINW;
        for (let i = 0; i < 24; i++) { const mid = (lo2 + hi2) / 2; setCap(mid, HARDMIN); if (place(root, 0) <= W) lo2 = mid; else hi2 = mid; }
        setCap(lo2, HARDMIN); total = place(root, 0);
      }
    }
    all.forEach(n => setW(n, n.bsize));
    all.forEach(measure);
    const levelBox = Array(L).fill(0);
    all.forEach(n => { levelBox[n.depth] = Math.max(levelBox[n.depth], n.hb); });
    all.forEach(n => {
      const extra = levelBox[n.depth] - n.hb;
      if (extra > 0) {
        const cs = getComputedStyle(n.box);
        n.box.style.paddingTop = (parseFloat(cs.paddingTop) + extra / 2) + 'px';
        n.box.style.paddingBottom = (parseFloat(cs.paddingBottom) + extra / 2) + 'px';
      }
      n.hb = levelBox[n.depth];
      n.h = n.hb + (n.note ? NG + n.hn : 0);
    });
    const levelH = Array(L).fill(0);
    all.forEach(n => { levelH[n.depth] = Math.max(levelH[n.depth], n.h); });
    const ys = []; let y = 0;
    for (let d = 0; d < L; d++) { ys[d] = y; y += levelH[d] + LG; }
    totalH = y - LG;
    totalW = total;
    const ox = Math.max(0, Math.round((W - totalW) / 2));
    all.forEach(n => { n.x = ox + n.b; n.y = ys[n.depth]; });
  }
  all.forEach(n => {
    n.box.style.left = Math.round(n.x) + 'px'; n.box.style.top = Math.round(n.y) + 'px';
    if (n.note) { n.note.style.left = Math.round(n.x) + 'px'; n.note.style.top = Math.round(n.y + n.hb + NG) + 'px'; }
  });
  const q = v => Math.round(v) + 0.5;
  let d = '';
  all.forEach(n => {
    if (!n.kids.length) return;
    if (orient === 'h') {
      const px = Math.round(n.x + n.w), py = q(n.y + n.hb / 2), mx = q(n.x + n.w + LG / 2);
      const cys = n.kids.map(k => q(Math.round(k.y) + k.hb / 2));
      d += 'M' + px + ' ' + py + 'H' + mx;
      d += 'M' + mx + ' ' + Math.min(py, ...cys) + 'V' + Math.max(py, ...cys);
      n.kids.forEach((k, i) => { d += 'M' + mx + ' ' + cys[i] + 'H' + Math.round(k.x); });
    } else {
      const px = q(n.x + n.w / 2), py = Math.round(n.y + n.h), my = q(n.y + n.h + (LG - (n.h - n.hb > 0 ? 0 : 0)) / 2);
      const cxs = n.kids.map(k => q(Math.round(k.x) + k.w / 2));
      d += 'M' + px + ' ' + py + 'V' + my;
      d += 'M' + Math.min(px, ...cxs) + ' ' + my + 'H' + Math.max(px, ...cxs);
      n.kids.forEach((k, i) => { d += 'M' + cxs[i] + ' ' + my + 'V' + Math.round(k.y); });
    }
  });
  const H = Math.ceil(totalH) + 2;
  wrap.style.height = H + 'px';
  svg.setAttribute('width', Math.max(W, Math.ceil(totalW)));
  svg.setAttribute('height', H);
  svg.innerHTML = d ? '<path d="' + d + '"/>' : '';
}

function treeNodeEl(text) {
  const t = document.createElement('template');
  t.innerHTML = treeNodeHTML(text || '新節點');
  return t.content.firstElementChild;
}
function currentTreeNode() {
  const sel = getSelection();
  let el = sel.rangeCount ? elOf(sel.anchorNode) : null;
  let box = el && el.closest('.td-box, .td-note');
  if (!box && savedRange && savedRange.startContainer.isConnected) box = elOf(savedRange.startContainer).closest('.td-box, .td-note');
  return box ? box.closest('.td-node') : null;
}
function isRootNode(node) { return node.parentElement.classList.contains('tree-diagram'); }

function treeOp(op, nodeArg) {
  const node = nodeArg || currentTreeNode() || (treeAllSel && treeAllSel.isConnected ? treeAllSel.querySelector('.td-node') : null);
  if (!node) { toast('請先點選樹枝圖中的方框'); return; }
  const wrap = node.closest('.tree-diagram');
  let focus = null, selectAll = true, focusNote = false;
  if (op === 'child' || (op === 'sibling' && isRootNode(node))) {
    const n = treeNodeEl();
    node.querySelector(':scope > .td-children').appendChild(n);
    focus = n;
  } else if (op === 'sibling') {
    const n = treeNodeEl();
    node.after(n);
    focus = n;
  } else if (op === 'demote') {
    const prev = node.previousElementSibling;
    if (!prev || isRootNode(node)) { toast('上方沒有同層方框，無法降層'); return; }
    prev.querySelector(':scope > .td-children').appendChild(node);
    focus = node; selectAll = false;
  } else if (op === 'promote') {
    if (isRootNode(node)) return;
    const parent = node.parentElement.closest('.td-node');
    if (!parent || isRootNode(parent)) { toast('已位於第二層，無法再升層'); return; }
    parent.after(node);
    focus = node; selectAll = false;
  } else if (op === 'note') {
    let note = node.querySelector(':scope > .td-note');
    if (!note) {
      note = document.createElement('div');
      note.className = 'td-note';
      note.contentEditable = 'true';
      note.dataset.placeholder = '補充說明…';
      node.querySelector(':scope > .td-box').after(note);
    }
    placeCaret(note, false);
    layoutTree(wrap);
    placeCaret(note, false);
    markDirty(); scheduleLayout(); updateCtxBar();
    return;
  } else if (op === 'note-left' || op === 'note-center' || op === 'note-right') {
    const al = op.slice(5);
    const notes = treeAllSel === wrap ? [...wrap.querySelectorAll('.td-note')] : [node.querySelector(':scope > .td-note')].filter(Boolean);
    if (!notes.length) { toast('此方框尚無說明欄，請先按「＋說明」'); return; }
    notes.forEach(n => { n.style.textAlign = al; });
    layoutTree(wrap); markDirty();
    return;
  } else if (op === 'reset-size') {
    const boxes = treeAllSel === wrap ? [...wrap.querySelectorAll('.td-box')] : [node.querySelector(':scope > .td-box')];
    boxes.forEach(b => { delete b.dataset.w; delete b.dataset.h; b.style.minHeight = ''; });
    layoutTree(wrap); markDirty(); scheduleLayout();
    return;
  } else if (op === 'select-all') {
    setTreeAllSel(wrap);
    return;
  } else if (op === 'delete') {
    if (isRootNode(node)) { treeOp('delete-all', node); return; }
    const hasKids = node.querySelector(':scope > .td-children > .td-node');
    if (hasKids && !confirm('此方框下仍有子節點，確定一併刪除？')) return;
    const target = node.previousElementSibling || node.nextElementSibling || node.parentElement.closest('.td-node');
    node.remove();
    focus = target; selectAll = false;
  } else if (op === 'orient') {
    wrap.dataset.orient = wrap.dataset.orient === 'v' ? 'h' : 'v';
    focus = node; selectAll = false;
  } else if (op === 'delete-all') {
    deleteBlock(wrap);
    return;
  }
  layoutTree(wrap);
  if (focus) placeCaret(focus.querySelector(focusNote ? ':scope > .td-note' : ':scope > .td-box'), selectAll);
  markDirty(); scheduleLayout(); updateCtxBar();
}

docWrap.addEventListener('focusout', e => {
  if (e.target.classList && e.target.classList.contains('td-note')) {
    const wrap = e.target.closest('.tree-diagram');
    setTimeout(() => { if (wrap && wrap.isConnected) { layoutTree(wrap); scheduleLayout(); } }, 0);
  }
});

function hideCtxBar() { ctxBar.hidden = true; ctxMode = null; ctxTarget = null; }
function showCtx(mode, target) {

      '<button type="button" data-op="' + b[0] + '"' + (b[2] ? ' class="' + b[2] + '"' : '') + '>' + b[1] + '</button>').join('');

/* 樹枝圖：全選、方框縮放、複製大綱 */
function setTreeAllSel(wrap) {
  clearTreeAllSel();
  treeAllSel = wrap;
  wrap.classList.add('td-allsel');
  const box = wrap.querySelector('.td-box');
  if (box && !(document.activeElement && wrap.contains(document.activeElement))) {
    box.focus({ preventScroll: true });
    const r = document.createRange(); r.selectNodeContents(box); r.collapse(true);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    savedRange = r.cloneRange();
  }
  showCtx('tree', wrap);
  toast('已選取整張樹枝圖：字體、字級、顏色、粗體將套用至所有方框；Ctrl＋C 可複製大綱', 3200);
}
function clearTreeAllSel() {
  if (treeAllSel) treeAllSel.classList.remove('td-allsel');
  treeAllSel = null;
}
function treeOutline(wrap) {
  const lines = [];
  const walk = (node, d) => {
    const box = node.querySelector(':scope > .td-box');
    const note = node.querySelector(':scope > .td-note');
    lines.push('\t'.repeat(d) + box.innerText.replace(/\n+/g, ' ').trim() + (note && note.innerText.trim() ? '（' + note.innerText.replace(/\n+/g, ' ').trim() + '）' : ''));
    node.querySelectorAll(':scope > .td-children > .td-node').forEach(k => walk(k, d + 1));
  };
  const root = wrap.querySelector(':scope > .td-node');
  if (root) walk(root, 0);
  return lines.join('\n');
}

  }

}

function layoutComments() {
  railEl.style.minHeight = pagesEl.offsetHeight + 'px';

  const items = [...railEl.querySelectorAll('.comment-bubble')].map(b => ({
    b, m: pagesEl.querySelector('.comment-target[data-comment-id="' + b.dataset.commentId + '"]')
  }));
  items.forEach(it => { it.b.style.display = it.m ? '' : 'none'; });
  const vis = items.filter(it => it.m).map(it => {
    const rects = it.m.getClientRects();
    const top = ((rects.length ? rects[0].top : it.m.getBoundingClientRect().top) - railTop) / ZOOM - 6;
    return Object.assign(it, { want: top });
  });
  vis.sort((a, b) => a.want - b.want);
  let cursor = 0;
  vis.forEach(it => {
    const top = Math.max(it.want, cursor);
    it.b.style.top = top + 'px';
    cursor = top + it.b.offsetHeight + 8;
  });
}

function drawConnectors() {
  const base = docWrap.getBoundingClientRect();
  svgEl.setAttribute('width', docWrap.scrollWidth);
  svgEl.setAttribute('height', docWrap.scrollHeight);
  let out = '';
  railEl.querySelectorAll('.comment-bubble').forEach(b => {
    if (b.style.display === 'none') return;
    const id = b.dataset.commentId;
    const m = pagesEl.querySelector('.comment-target[data-comment-id="' + id + '"]');
    if (!m) return;
    const rects = m.getClientRects();
    if (!rects.length) return;
    const r = rects[rects.length - 1];
    const page = m.closest('.a4-page');
    if (!page) return;
    const pr = page.getBoundingClientRect();
    const br = b.getBoundingClientRect();
    const x1 = (r.right - base.left) / ZOOM, y1 = (r.top + r.height / 2 - base.top) / ZOOM;
    const xp = (pr.right - base.left) / ZOOM;
    const x2 = (br.left - base.left) / ZOOM, y2 = (br.top - base.top) / ZOOM + 14;
    const cls = id === activeCommentId ? ' active' : '';
    out += '<path class="conn' + cls + '" d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' L' + xp.toFixed(1) + ' ' + y1.toFixed(1) + ' L' + x2.toFixed(1) + ' ' + y2.toFixed(1) + '"/>';
    out += '<circle class="dotp' + cls + '" cx="' + x1.toFixed(1) + '" cy="' + y1.toFixed(1) + '" r="2"/>';
  });
  svgEl.innerHTML = out;
}

function renumberFootnotes() {
  const pages = [...pagesEl.querySelectorAll('.a4-page')];
  const seen = new Set();
  let n = 0;
  pages.forEach((page, pi) => {
    const body = page.querySelector('.page-body');
    const list = page.querySelector('.fn-list');
    let prev = null;
    body.querySelectorAll('sup.fn-ref').forEach(ref => {
      let id = ref.dataset.fnId;
      if (!id || seen.has(id)) { id = uid('fn'); ref.dataset.fnId = id; }
      seen.add(id);
      n++;
      let a = ref.querySelector('a');
      if (!a) { a = document.createElement('a'); ref.appendChild(a); }
      a.setAttribute('href', '#fn-' + n);
      a.id = 'fnref-' + n;
      if (a.textContent !== String(n)) a.textContent = String(n);
      ref.contentEditable = 'false';
      let item = pagesEl.querySelector('li.fn-item[data-fn-id="' + id + '"]');
      if (!item) item = createFnItem(id);
      item.id = 'fn-' + n;
      const num = item.querySelector('.fn-num');
      if (num.textContent !== String(n)) num.textContent = String(n);
      item.querySelector('.fn-back').setAttribute('href', '#fnref-' + n);
      const inPlace = item.parentElement === list && item.previousElementSibling === prev;
      if (!inPlace) { if (prev) prev.after(item); else list.prepend(item); }
      prev = item;
    });
    const num = page.querySelector('.page-number');
    if (num) num.textContent = '— ' + (pi + 1) + ' —';
  });
  pagesEl.querySelectorAll('li.fn-item').forEach(li => { if (!seen.has(li.dataset.fnId)) li.remove(); });
  pages.forEach(page => {
    const footer = page.querySelector('.page-footer-footnotes');
    footer.classList.toggle('has-notes', !!footer.querySelector('li.fn-item'));
  });
}

/* =========================================================
   分頁機制
   ========================================================= */
function makePageElement(bodyHTML) {
  const tpl = document.createElement('template');
  tpl.innerHTML = pageHTML(bodyHTML);
  return tpl.content.firstElementChild;
}

function insertPageBreak() {
  const r = needRange('請先將游標置於本文中要分頁的位置'); if (!r) return;
  const el = elOf(r.startContainer);
  const body = el.closest('.page-body');
  if (!body) { toast('分頁符僅能插入於本文區'); return; }
  if (el.closest('.quote-block, .tree-diagram, table')) { toast('請將游標移到一般段落後再分頁'); return; }
  if (!r.collapsed) r.collapse(false);
  const page = body.closest('.a4-page');
  const tail = document.createRange();
  tail.setStart(r.startContainer, r.startOffset);
  tail.setEnd(body, body.childNodes.length);
  const frag = tail.extractContents();
  frag.querySelectorAll('.page-break').forEach(pb => pb.remove());
  [...body.children].forEach(c => { if (c.classList.contains('page-break')) c.remove(); });
  const last = body.lastElementChild;
  if (last && last.tagName === 'P' && isEmptyBlock(last) && body.children.length > 1) last.remove();
  fixEmptyBlocks(body);
  if (!body.firstChild) body.innerHTML = '<p><br></p>';
  const pb = document.createElement('div');
  pb.className = 'page-break';
  pb.contentEditable = 'false';
  body.appendChild(pb);
  const newPage = makePageElement('');
  const newBody = newPage.querySelector('.page-body');
  newBody.innerHTML = '';
  newBody.appendChild(frag);
  [...newBody.childNodes].forEach(n => { if (n.nodeType === 3 && !n.textContent.trim()) n.remove(); });
  fixEmptyBlocks(newBody);
  if (!newBody.firstElementChild) newBody.innerHTML = '<p><br></p>';
  page.after(newPage);
  renumberFootnotes();
  layoutAllTrees();
  const first = newBody.firstElementChild;
  newBody.focus({ preventScroll: true });
  const cr = document.createRange(); cr.setStart(first, 0); cr.collapse(true);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(cr);
  savedRange = cr.cloneRange();
  reflowAll();
  newPage.scrollIntoView({ behavior: 'smooth', block: 'start' });
  markDirty(); scheduleLayout();
}

function mergeIntoPrevious(page) {
  const prev = page.previousElementSibling;
  if (!prev || !prev.classList.contains('a4-page')) return;
  const prevBody = prev.querySelector('.page-body');
  const body = page.querySelector('.page-body');
  [...prevBody.querySelectorAll(':scope > .page-break')].forEach(pb => pb.remove());
  const lastPrev = prevBody.lastElementChild;
  if (lastPrev && lastPrev.tagName === 'P' && isEmptyBlock(lastPrev) && prevBody.children.length > 1) lastPrev.remove();
  let firstMoved = null;
  [...body.childNodes].forEach(n => {
    if (!firstMoved && (n.nodeType === 1 || n.textContent.trim())) firstMoved = n;
    prevBody.appendChild(n);
  });
  const prevList = prev.querySelector('.fn-list');
  page.querySelectorAll('li.fn-item').forEach(li => prevList.appendChild(li));
  page.remove();
  if (!prevBody.firstChild) prevBody.innerHTML = '<p><br></p>';
  prevBody.focus({ preventScroll: true });
  const r = document.createRange();
  if (firstMoved && firstMoved.isConnected) r.setStart(firstMoved, 0);
  else r.selectNodeContents(prevBody);
  r.collapse(true);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  savedRange = r.cloneRange();
  renumberFootnotes();
  markDirty(); scheduleLayout(); scheduleReflow(0);
}

/* =========================================================
   本文結構正規化與全域編輯事件
   ========================================================= */
function normalizeBody(body) {
  const sel = getSelection();
  let saved = null;
  if (sel.rangeCount) { const r = sel.getRangeAt(0); saved = [r.startContainer, r.startOffset, r.endContainer, r.endOffset]; }
  let run = null, changed = false;
  [...body.childNodes].forEach(n => {
    if (n.nodeType === 8) return;
    const isBlock = n.nodeType === 1 && BLOCK_RE.test(n.nodeName);
    if (isBlock) { run = null; return; }
    if (n.nodeType === 3 && !n.textContent.trim() && !run) return;
    if (!run) { run = document.createElement('p'); body.insertBefore(run, n); changed = true; }
    run.appendChild(n);
  });
  if (!body.firstElementChild) { body.innerHTML = '<p><br></p>'; changed = true; saved = null; placeCaret(body.firstElementChild, false); }
  if (changed && saved && saved[0].isConnected && saved[2].isConnected) {
    try { sel.setBaseAndExtent(saved[0], saved[1], saved[2], saved[3]); } catch (_) { /* 忽略 */ }
  }
}

function plainPaste(e) {
  if (!isEditable(e.target)) return;
  e.preventDefault();
  const cd = e.clipboardData || window.clipboardData;
  const files = cd.files && cd.files.length ? [...cd.files].filter(f => /^image\//.test(f.type)) : [];
  if (files.length) { insertImages(files, currentRange()); return; }
  let text = cd.getData('text/plain');
  if (!text) return;
  text = text.replace(/\r\n?/g, '\n').replace(/[\u200B\uFEFF]/g, '').replace(/\u00A0/g, ' ');
  const el = elOf(e.target);
  const r = currentRange();
  if (r && !r.collapsed && /^\s*(https?:\/\/|www\.)\S+\s*$/i.test(text)) {
    wrapRangeWithLink(normalizeUrl(text.trim()));
    markDirty();
    return;
  }
  if (el.closest('.cd-title, .fn-text, .quote-src-text')) { document.execCommand('insertText', false, text.replace(/\n+/g, ' ')); return; }
  const lines = text.replace(/\n{3,}/g, '\n\n').split('\n');
  const softBreak = !!el.closest('.td-box, .td-note, .cb-body, td, th');
  lines.forEach((ln, i) => {
    if (i) document.execCommand(softBreak ? 'insertLineBreak' : 'insertParagraph');
    if (ln) document.execCommand('insertText', false, ln);
  });
  const host = getHost(el);
  if (host) {
    host.querySelectorAll('[style*="background"]').forEach(x => { if (!x.closest('td, th') && !x.classList.contains('hl')) x.style.background = ''; });
  }
}

  if (!r || !isEditable(r.startContainer)) r = savedRange && savedRange.startContainer.isConnected ? savedRange.cloneRange() : null;
  insertImages(e.dataTransfer.files, r).then(ok => { if (!ok) toast('只能拖曳圖片檔'); });
});

const sel0 = () => { const s = getSelection(); return s.rangeCount ? s.anchorNode : null; };
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') {
    $('#table-picker').hidden = true;
    closeMenu();
    if (document.getElementById('dlg-overlay')) { closeDialog(); return; }
    if (!$('#graph-overlay').hidden) { closeGraph(); return; }
  }
  if (mod && !e.altKey && (e.key === 'f' || e.key === 'F' || e.key === 'h' || e.key === 'H')) {
    if (e.target.closest && e.target.closest('#sticky-layer, #dlg-overlay')) return;
    e.preventDefault();
    openFind(e.key.toLowerCase() === 'h');
    return;
  }
  if (e.key === 'Escape' && !findBar.hidden) { closeFind(); return; }
  if (mod && (e.key === 's' || e.key === 'S')) {
    e.preventDefault();
    if (e.shiftKey) saveAs(); else saveNow();
    return;
  }

   圖片：拖曳、貼上、插入與自由縮放
   ========================================================= */
let imgDrag = null;
function readImageFile(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => resolve({ src: fr.result, w: 400 });
      im.onload = () => {
        const MAX = 1800;
        const big = Math.max(im.naturalWidth, im.naturalHeight);
        if (big <= MAX && /^image\/(png|jpeg|gif)$/.test(file.type)) { resolve({ src: fr.result, w: im.naturalWidth }); return; }
        const s = Math.min(1, MAX / big);
        const c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
        const x = c.getContext('2d');
        if (file.type !== 'image/png') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
        x.drawImage(im, 0, 0, c.width, c.height);
        resolve({ src: file.type === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.88), w: c.width });
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function makeImgWrap(src, w) {
  const wrap = document.createElement('span');
  wrap.className = 'img-wrap';
  wrap.contentEditable = 'false';
  const img = document.createElement('img');
  img.className = 'doc-img';
  img.src = src;
  img.draggable = false;
  img.alt = '';
  if (w) img.style.width = w + 'px';
  const h = document.createElement('span');
  h.className = 'img-handle';
  h.title = '拖曳縮放';
  const del = document.createElement('span');
  del.className = 'img-del';
  del.title = '刪除圖片';
  del.textContent = '✕';
  wrap.append(img, h, del);
  return wrap;
}
async function insertImages(files, range) {
  const list = [...files].filter(f => /^image\//.test(f.type));
  if (!list.length) return false;
  if (!range || !isEditable(range.startContainer)) { toast('請先將游標置於本文中要放圖片的位置'); return true; }
  const host = getHost(range.startContainer);
  const maxW = Math.max(80, (elOf(range.startContainer).closest('td, th, .page-body, .cd-body, .cb-body') || host).clientWidth - 4);
  let r = range.cloneRange();
  r.collapse(false);
  if (r.startContainer === host && host.classList.contains('page-body')) {
    const p = document.createElement('p');
    const ref = host.childNodes[r.startOffset] || null;
    host.insertBefore(p, ref);
    r = document.createRange(); r.setStart(p, 0); r.collapse(true);
  }
  for (const f of list) {
    const res = await readImageFile(f);
    const wrap = makeImgWrap(res.src, Math.min(res.w, maxW));
    r.insertNode(wrap);
    r.setStartAfter(wrap); r.collapse(true);
  }
  if (host) host.focus({ preventScroll: true });
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  savedRange = r.cloneRange();
  markDirty(); scheduleReflow(60); scheduleLayout();
  if (host && host.id === 'cd-body') syncDrawerBody();
  return true;
}

function computeBacklinks(cardId) {
  commitCurrent();
  computeCardNos();
  const out = [];
  const scan = (html, push) => {
    if (!html || html.indexOf(cardId) < 0) return;
    const t = document.createElement('template'); t.innerHTML = html;
    let chapter = '', i = 0;
    t.content.querySelectorAll('h1, h2, h3, h4, h5, h6, .card-badge').forEach(el => {
      if (/^H[1-6]$/.test(el.tagName)) {

    });
  };
  const walk = nodes => nodes.forEach(n => {
    if (n.type === 'note') scan(data.notes[n.id] && data.notes[n.id].html, (b, i, chapter) => out.push({ type: 'note', id: n.id, label: n.name, chapter, ctx: badgeContext(b), index: i }));

/* =========================================================

   ========================================================= */
const graph = { nodes: [], edges: [], map: new Map(), s: 1, tx: 0, ty: 0, alpha: 1, focus: null, drag: null, pan: null, hover: null, raf: 0, moved: false };
const gCanvas = $('#graph-canvas');
const gCtx = gCanvas.getContext('2d');
const GRAPH_FONT = '12px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif';

function buildGraph() {
  commitCurrent();
  computeCardNos();
  const old = graph.map;
  const nodes = [], edges = [], map = new Map();
  gCtx.font = GRAPH_FONT;
  const add = (id, kind, label, near) => {
    const o = old.get(id);
    const p = near && map.get(near);
    const sx = p ? p.x + (Math.random() - 0.5) * 160 : (Math.random() - 0.5) * 700;
    const sy = p ? p.y + (Math.random() - 0.5) * 160 : (Math.random() - 0.5) * 700;
    const n = { id, kind, label, x: o ? o.x : sx, y: o ? o.y : sy, vx: 0, vy: 0, r: kind === 'folder' ? 9 : kind === 'note' ? 7 : 5.5 };

  };
  const walk = (list, parent) => list.forEach(n => {
    add(n.id, n.type === 'cfolder' ? 'folder' : 'card', cardLabel(n), parent);
    if (parent) edges.push({ s: parent, t: n.id, type: 'tree' });
    walk(n.children, n.id);
  });
  walk(data.slipbox.tree, null);
  const refsOf = html => {
    const ids = new Set();
    if (html && html.indexOf('card-badge') >= 0) {
      const t = document.createElement('template'); t.innerHTML = html;
      t.content.querySelectorAll('.card-badge').forEach(b => { if (map.has(b.dataset.cardId)) ids.add(b.dataset.cardId); });

  };
  const walkN = list => list.forEach(n => {
    if (n.type === 'note') {

function nodeBox(n) { return { x1: n.x - n.r - 4, x2: n.x + n.r + 6 + n.tw + 4, y1: n.y - 12, y2: n.y + 12 }; }

  const N = graph.nodes, a = graph.alpha;

    for (let j = i + 1; j < N.length; j++) {
      const p = N[i], q = N[j];
      let dx = (q.x + q.tw / 2) - (p.x + p.tw / 2), dy = q.y - p.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 0.5; }
      if (d2 > 640000) continue;
      const d = Math.sqrt(d2), f = 14000 / d2;

      q.fx += dx / d * f; q.fy += dy / d * f;

    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;

/* =========================================================

const findBar = $('#find-bar');
const fbQ = $('#fb-q'), fbR = $('#fb-r');
let findMatches = [], findIdx = -1, findSeq = -1, findTimer = null;
const hasHL = typeof Highlight === 'function' && window.CSS && CSS.highlights;

function staticEditable(t) {
  const e = t.parentElement && t.parentElement.closest('[contenteditable]');

}
function textIndex(root) {
  let str = '';

    for (const n of el.childNodes) {
      if (n.nodeType === 3) {
        if (staticEditable(n)) { segs.push({ node: n, start: str.length }); str += n.textContent; }

      } else if (n.nodeType === 1) {

}

function scrollToMatch(m) {

  if (rect.top < wr.top + 40 || rect.bottom > wr.bottom - 40) {
    workspace.style.scrollBehavior = 'auto';

    workspace.style.scrollBehavior = '';

}
function stepFind(dir) {

}
function openFind(withReplace) {

  findBar.classList.toggle('with-replace', !!withReplace);

}
function closeFind() {

fbQ.addEventListener('input', () => { clearTimeout(findTimer); findTimer = setTimeout(() => runFind(), 120); });
fbQ.addEventListener('keydown', e => {

  else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
});
fbR.addEventListener('keydown', e => {

  else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
});
$('#fb-next').addEventListener('click', () => stepFind(1));

}
function replaceOne() {
  if (findSeq !== editSeq) runFind(true);
  const m = findMatches[findIdx];

  execReplace(m, fbR.value);

function staticReplace(root, q, repl) {
  const ms = searchIn(root, q);

const OL_STYLES = [

function cjkNum(n, formal) {

  const W = ['', '萬', '億'];
  if (n === 0) return D[0];
  const four = x => {
    let s = '', zero = false;
    const ds = String(x).padStart(4, '0').split('').map(Number);
    ds.forEach((d, i) => {
      const u = U[3 - i];
      if (d === 0) { zero = s.length > 0; return; }
      if (zero) { s += D[0]; zero = false; }
      s += D[d] + u;

  };

  const parts = [];

    if (!parts[i]) { if (s && !s.endsWith(D[0])) s += D[0]; continue; }
    if (s && parts[i] < 1000 && !s.endsWith(D[0])) s += D[0];
    s += four(parts[i]) + W[i];

    pagesEl.querySelectorAll('.comment-target').forEach(m => { cmCount[m.dataset.commentId] = (cmCount[m.dataset.commentId] || 0) + 1; });
    const isBold = el => /^(B|STRONG)$/.test(el.tagName) || (el.style && (el.style.fontWeight === 'bold' || +el.style.fontWeight >= 600));
    const inl = node => {
      if (node.nodeType === 3) return mdEscape(node.textContent.replace(/[\r\n\t]+/g, '').replace(/ /g, ' '));
      if (node.nodeType !== 1) return '';
      const el = node;
      const kids = () => [...el.childNodes].map(inl).join('');
      if (el.tagName === 'BR') return '  \n';
      if (el.classList.contains('fn-ref')) {
        const li = pagesEl.querySelector('li.fn-item[data-fn-id="' + el.dataset.fnId + '"]');
        fns.push(li ? [...li.querySelector('.fn-text').childNodes].map(inl).join('') : '');
        return '[^' + fns.length + ']';
      }
      if (el.classList.contains('comment-target')) {
        const id = el.dataset.commentId;
        cmSeen[id] = (cmSeen[id] || 0) + 1;
        const tail = cmSeen[id] === cmCount[id] && cmText.get(id) ? ' <!-- 旁註：' + cmText.get(id) + ' -->' : '';
        return kids() + tail;
      }
      if (el.classList.contains('card-badge')) return ' [[' + el.textContent.replace(/^\[|\]$/g, '') + ']]';
      if (el.classList.contains('math')) return el.dataset.display === '1' ? '\n\n$$\n' + el.dataset.tex + '\n$$\n\n' : '$' + el.dataset.tex + '$';
      if (el.classList.contains('img-wrap')) { const im = el.querySelector('img'); return im ? '![](' + im.src + ')' : ''; }
      if (el.tagName === 'A' && el.classList.contains('doc-link')) return '[' + kids() + '](' + el.getAttribute('href') + ')';
      if (el.classList.contains('hl')) return '==' + kids() + '==';
      if (el.classList.contains('ol-num')) return el.textContent;
      const inner = kids();
      if (!inner.trim()) return inner;
      if (isBold(el)) return '**' + inner + '**';
      if (el.tagName === 'U' || (el.style && /underline/.test(el.style.textDecoration || ''))) return '<u>' + inner + '</u>';
      if (/^(I|EM)$/.test(el.tagName)) return '*' + inner + '*';
      return inner;
    };
    const blocks = [];
    const treeMd = wrap => {
      const lines = [];
      const walk = (node, d) => {
        const box = node.querySelector(':scope > .td-box'), note = node.querySelector(':scope > .td-note');
        lines.push('  '.repeat(d) + '- ' + [...box.childNodes].map(inl).join('').replace(/ {2}\n/g, ' ') + (note && note.innerText.trim() ? '（' + note.innerText.trim() + '）' : ''));
        node.querySelectorAll(':scope > .td-children > .td-node').forEach(k => walk(k, d + 1));
      };
      const root = wrap.querySelector(':scope > .td-node'); if (root) walk(root, 0);
      return lines.join('\n');
    };
    const tableMd = tbl => {
      const { grid, ncol } = buildGrid(tbl);
      const rows = grid.slice(0, tbl.rows.length).map(row => {
        const seen = new Set();
        return Array.from({ length: ncol }, (_, c) => { const td = row && row[c]; if (!td || seen.has(td)) return ''; seen.add(td); return [...td.childNodes].map(inl).join('').replace(/\|/g, '\\|').replace(/\s*\n\s*/g, '<br>').trim(); });
      });
      if (!rows.length) return '';
      const line = r => '| ' + r.join(' | ') + ' |';
      return [line(rows[0]), '| ' + Array(ncol).fill('---').join(' | ') + ' |', ...rows.slice(1).map(line)].join('\n');
    };
    const conv = (el, quote) => {
      if (el.nodeType === 3) { const t = el.textContent.trim(); if (t) blocks.push(mdEscape(t)); return; }
      if (el.nodeType !== 1) return;
      if (el.classList.contains('page-break')) { blocks.push('---'); return; }
      if (el.classList.contains('tree-diagram')) { blocks.push(treeMd(el)); return; }
      if (el.tagName === 'TABLE') { blocks.push(tableMd(el)); return; }
      if (el.tagName === 'COLGROUP') return;
      if (el.classList.contains('fold')) {
        const title = [...el.querySelector('.fold-title').childNodes].map(inl).join('');
        const sub = [];
        const save = blocks.length;
        [...el.querySelector('.fold-b').childNodes].forEach(c => conv(c));
        const inner = blocks.splice(save).join('\n\n');
        sub.push('> [!note]- ' + title);
        inner.split('\n').forEach(l => sub.push('> ' + l));
        blocks.push(sub.join('\n'));
        return;
      }
      if (el.classList.contains('quote-block')) { const t = el.querySelector('.quote-text'); if (t) blocks.push('> ' + [...t.childNodes].map(inl).join('').trim().replace(/\n/g, '\n> ')); return; }
      const lv = /^H[1-6]$/.test(el.tagName) ? headingLevel(el) : 0;
      const text = [...el.childNodes].map(inl).join('').trim();
      if (!text) return;
      if (lv) blocks.push(lv <= 6 ? '#'.repeat(lv) + ' ' + text : '**' + text + '**');
      else if (el.classList.contains('quote')) blocks.push('> ' + text.replace(/\n/g, '\n> '));
      else blocks.push(text);
    };
    pagesEl.querySelectorAll('.page-body').forEach(b => [...b.childNodes].forEach(c => conv(c)));
    let md = '# ' + activeNoteName() + '\n\n' + blocks.join('\n\n') + '\n';
    if (fns.length) md += '\n' + fns.map((t, i) => '[^' + (i + 1) + ']: ' + t).join('\n') + '\n';
    downloadBlob(new Blob([md], { type: 'text/markdown;charset=utf-8' }), safeFileName(activeNoteName()) + '.md');
    toast('Markdown 已匯出');
  } finally {
    reflowAll();
  }
}

/* =========================================================
   區塊快速刪除（折疊框、樹枝圖、表格、舊式引文框）＋ 可復原
   ========================================================= */
const BLOCK_SEL = '.fold, .tree-diagram, table.doc-table, blockquote.quote-block';
const BLOCK_NAME = el => el.classList.contains('fold') ? '折疊框' : el.classList.contains('tree-diagram') ? '樹枝圖' : el.tagName === 'TABLE' ? '表格' : '引文框';

const blockHandle = document.createElement('div');
blockHandle.id = 'block-handle';

const undoBar = document.createElement('div');

undoBar.hidden = true;
document.body.appendChild(undoBar);

function deleteBlock(el) {
  if (!el || !el.isConnected) return;
  const name = BLOCK_NAME(el);
  const body = el.closest('.page-body');
  const parent = el.parentNode, next = el.nextElementSibling, prev = el.previousElementSibling;
  clearPendingDel();
  if (treeAllSel === el) clearTreeAllSel();

  el.remove();

  if (body && !body.querySelector(':scope > :not(.page-break)')) body.insertBefore(Object.assign(document.createElement('p'), { innerHTML: '<br>' }), body.firstChild);
  const target = next && next.nodeType === 1 && next.isConnected && !next.classList.contains('page-break') ? next : (parent && parent.isConnected ? (parent.querySelector(':scope > p') || parent) : null);
  if (target && isEditable(target)) placeCaret(target.matches(BLOCK_SEL) ? (body || target) : target, false);
  markDirty(); scheduleReflow(0); scheduleLayout();
  showUndo('已刪除' + name);
}
function showUndo(msg, fn) {
  undoBar.innerHTML = '<span></span><button type="button">復原</button>';
  undoBar.querySelector('span').textContent = msg;
  undoBar.hidden = false;
  undoBar.querySelector('button').onclick = fn || undoDelete;
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { undoBar.hidden = true; }, 8000);
}
function undoDelete() {
  const d = lastDeleted;
  undoBar.hidden = true;
  if (!d) return;
  if (d.next && d.next.isConnected) d.next.before(d.el);
  else if (d.prev && d.prev.isConnected) d.prev.after(d.el);
  else if (d.parent && d.parent.isConnected) d.parent.appendChild(d.el);
  else { const b = pagesEl.querySelector('.page-body'); if (!b) { toast('無法復原：原位置已不存在'); return; } b.appendChild(d.el); }
  lastDeleted = null;
  if (d.el.classList.contains('tree-diagram')) layoutTree(d.el);
  flash(d.el);
  markDirty(); scheduleReflow(0); scheduleLayout();
}
function unfold(f) {
  const t = f.querySelector('.fold-title'), b = f.querySelector('.fold-b');
  const frag = document.createDocumentFragment();
  if (t && t.textContent.trim()) { const p = document.createElement('p'); const s = document.createElement('b'); while (t.firstChild) s.appendChild(t.firstChild); p.appendChild(s); frag.appendChild(p); }
  if (b) while (b.firstChild) frag.appendChild(b.firstChild);
  const first = frag.firstChild;

function unquoteBlock(q) {

  if (t) [...t.childNodes].forEach(n => { if (n.nodeType === 1 && BLOCK_RE.test(n.tagName)) { n.classList.add('quote'); frag.appendChild(n); } else if (n.textContent.trim()) { const p = document.createElement('p'); p.className = 'quote'; p.appendChild(n); frag.appendChild(p); } });

  markDirty(); scheduleReflow(0);
}

/* 滑鼠移到區塊上 → 右上角出現快捷鈕 */
let handleTarget = null, handleHideTimer = null;
function hideBlockHandle() { blockHandle.hidden = true; handleTarget = null; }
function showBlockHandle(el) {

/* 連按兩次 Backspace／Delete 刪除前後的區塊 */
function clearPendingDel() {
  if (pendingDel && pendingDel.el) pendingDel.el.classList.remove('del-pending');
  pendingDel = null;
}
function armPendingDel(el, key) {
  if (pendingDel && pendingDel.el === el && pendingDel.key === key && Date.now() - pendingDel.t < 4000) { deleteBlock(el); return; }
  clearPendingDel();
  pendingDel = { el, key, t: Date.now() };
  el.classList.add('del-pending');
  toast('再按一次 ' + key + ' 即刪除此' + BLOCK_NAME(el) + '（刪除後可復原）', 3500);
}
function blockDeleteKey(e, r, el) {
  if (!r.collapsed || (e.key !== 'Backspace' && e.key !== 'Delete')) { if (pendingDel && e.key !== 'Shift') clearPendingDel(); return false; }
  const ft = el.closest('.fold-title');
  if (ft && e.key === 'Backspace' && !ft.textContent.trim()) { e.preventDefault(); armPendingDel(ft.closest('.fold'), 'Backspace'); return true; }
  const fb = el.closest('.fold-b');
  if (fb && e.key === 'Backspace' && !fb.textContent.trim() && !fb.querySelector('img,table,.tree-diagram,.math')) { e.preventDefault(); armPendingDel(fb.closest('.fold'), 'Backspace'); return true; }
  const container = el.closest('.page-body, .fold-b');
  if (!container) return false;
  let blk = el;
  while (blk && blk.parentElement !== container) blk = blk.parentElement;
  if (!blk || blk.matches(BLOCK_SEL)) return false;
  const neighbor = dir => {
    let x = dir < 0 ? blk.previousElementSibling : blk.nextElementSibling;
    while (x && x.classList.contains('page-break')) x = dir < 0 ? x.previousElementSibling : x.nextElementSibling;
    if (x || !container.classList.contains('page-body')) return x;
    const page = container.closest('.a4-page');
    const other = dir < 0 ? page.previousElementSibling : page.nextElementSibling;
    if (!other || !other.classList.contains('a4-page') || (dir < 0 ? page.dataset.auto !== '1' : other.dataset.auto !== '1')) return null;
    const kids = [...other.querySelector('.page-body').children].filter(k => !k.classList.contains('page-break'));
    return dir < 0 ? kids[kids.length - 1] : kids[0];
  };
  if (e.key === 'Backspace') {
    const prev = neighbor(-1);
    if (prev && prev.matches(BLOCK_SEL)) {
      const t = document.createRange(); t.setStart(blk, 0); t.setEnd(r.startContainer, r.startOffset);
      if (!t.toString().replace(/​/g, '') && !t.cloneContents().querySelector('img,sup,.card-badge,.math')) {
        e.preventDefault();
        armPendingDel(prev, 'Backspace');
        return true;
      }
    }
  } else {
    const next = neighbor(1);
    if (next && next.matches(BLOCK_SEL)) {
      const t = document.createRange(); t.setStart(r.endContainer, r.endOffset); t.setEnd(blk, blk.childNodes.length);
      if (!t.toString().replace(/​/g, '') && !t.cloneContents().querySelector('img,sup,.card-badge,.math')) { e.preventDefault(); armPendingDel(next, 'Delete'); return true; }
    }
  }
  return false;
}
document.addEventListener('mousedown', e => { if (pendingDel && !(e.target.closest && e.target.closest('#undo-bar'))) clearPendingDel(); });

function openManual() {
  commitCurrent();
  const f = findNode(MANUAL_ID);
  let note = data.notes[MANUAL_ID];
  if (f && note && note.manualVer !== MANUAL_VER &&
      confirm('使用說明書有新版本。要更新嗎？\n（更新會覆蓋你在說明書頁面中做的修改；選「取消」則開啟現有版本）')) {
    const m = manualHTML();
    Object.assign(note, { html: m.html, comments: m.comments, manualVer: MANUAL_VER, outline: true });
    markDirty();
  }
  if (!f || !note) {
    const m = manualHTML();
    if (!f) data.tree.unshift({ id: MANUAL_ID, type: 'note', name: '使用說明書' });
    data.notes[MANUAL_ID] = { html: m.html, comments: m.comments, manualVer: MANUAL_VER, outline: true };
    markDirty();
  }
  data.ui.sideTab = 'notes';
  loadNote(MANUAL_ID);
  renderTree();
}
$('#btn-help').addEventListener('click', openManual);

    H1('法確證原則的批判'),

    P('1、霍布斯—洛克—費希特：屬「' + HL('自外於法') + '」（outlaw）之觀點。國家無法以公力保護個人時，個人即撤出社會契約，退返無拘束之自然或戰爭狀態，正當防衛本質上屬毫無限制之反擊行為' + N(A + '頁332-333。洛克認受攻擊者殺害侵害者「如同殺死野獸」；費希特認違法市民立即外於國家、法權秩序，「就如同一隻野生小鳥」。') + '。'),

    H3('黑格爾與 Berner'),

    P(R('惟作者認為') + '，Berner 之 Recht 比較接近' + HL('主觀權利') + '（das subjektive Recht），理由如下：（1）Berner 論緊急避難係 Recht 與 Recht 之衝突，並談及 Recht 之價值高低，應指主觀權利；（2）Berner 明言「正當防衛絕非市民義務，而是市民權利」；（3）Berner 推論第三人於他人權利受攻擊時亦有正當防衛權，難以將防衛「權」理解為防衛「法」' + N(A + '頁337-338；Berner, a.a.O., S. 554, 557, 562（原文註97、98、100）。') + '。故該名言之正確解讀應為：'),
    Q('「權利無須退讓不法」。正當防衛即是出於主觀權利反抗不法的容許行為，在此涉及的是侵害者與被害者之間的衝突，而不是法／不法之間的對抗。'),
    P('（' + A + '頁338-339）'),
    H2('正當防衛的積極一般預防功能'),
    P('支持者認為，正當防衛使不法行為附帶「嗣後國家刑事訴追」及「受侵害者即時合法反擊」兩種成本，從而達成行為規範之一般預防效果' + N(A + '頁339；Roxin, Notwehr und Rechtsbewährung, Kühl-FS, S. 394-398（原文註104）。') + '。作者不贊同，理由為：'),
    I('1、積極一般預防之宣示對象為一般國民，其成本須以合法為前提；惟防衛者當下無法確定其防衛是否合法，以之為成本反使國民遵法意識模糊，甚至讓潛在犯罪者決意賭博' + N(A + '頁339-340。') + '。'),
    I('2、將私人防衛當作防範犯罪之預期成本，無異賦予正當防衛類刑罰屬性，破棄刑罰權歸諸公有、抗拒私人同害刑之現代刑法思想' + N(A + '頁340；原文註107：支持者（Roxin）雖謂正當防衛並非視同刑罰，惟作者認為只有刑罰足以具備宣告合法／不法界限之積極一般預防機能。') + '。'),
    I('3、可正當防衛之利益限於個人法益，若納入正當防衛成本，將打破立法者以法定刑所設計之預防需求光譜。例如竊盜罪（刑法第 320 條）為 5 年以下並可能面臨正當防衛成本；公務員違背職務收賄罪（刑法第 122 條）刑度 3 年至 10 年卻不得正當防衛，兩者成本高低即無從比較' + N(A + '頁341；Renzikowski, Notstand und Notwehr, S. 89 ff.（原文註110）。') + '。'),
    P('故積極一般預防至多僅於構成要件之不法行為規制上有效，不能展開至阻卻違法事由之除罪功能。'),
    H2('正當防衛的要件與法確證原則'),

    I('1、防衛情狀：法秩序受威脅從不構成防衛情狀，且通說認不得為超個人法益正當防衛，又如何保護超越個人之法秩序完整性？'),
    I('2、防衛手段：適當性、必要性均未納入法秩序之考量；且法秩序係' + M('抽象而難以量化之價值', 'cmt-ex-4', '【思考】通說等於主張「1＋1 必然大於 1」；作者質疑：防衛致侵害者死亡時，如何能認為法秩序抽象價值加上受害者利益「必然」大於侵害者之生命？（原文頁343）') + '，難以與具體個人利益比較。'),
    I('3、法益價值不分：甲被強盜奪取 100 元與乙受殺手威脅生命，在通說架構下均可採取任何有效且必要之手段，才需再以社會倫理限制補救。'),
    I('4、防衛意識：從無見解要求防衛者認知「法秩序受危害」。'),

    /* ---------- 肆 ---------- */
    H1('個人保護原則的重塑'),

    H2('法外私力說'),
    P('本說認為個人受不法侵害而國家無力即時保護時，得撤回社會契約之參與意思，退回自然狀態，實施不受任何限制之私人暴力，亦無阻卻違法要件之限制' + N(A + '頁346；Klose, ZStW 89 (1977); Erb, NStZ 2005（原文註124）。原文註125特別說明：Erb 一方面承認正當防衛不在法治界限內，解釋進路則仍取道法定界限方法。') + '。'),
    P('此說之缺失在於：（1）「自外於法」使防衛者處於法規範管制範圍之外，與刑法典之成文規範屬性不符；（2）自然狀態中不問防衛情狀、手段、防衛意識，不合於現代正當防衛論點。故無法回應現代正當防衛之「法化」（legalization）結構' + N(A + '頁346。') + '。'),
    H2('防衛權利說'),
    P('本說蛻變自康德，認為每個受法律保護之主觀權利，本質上均內蘊透過私力自我保護之推論權利，國家亦許可受侵犯者展開必要反擊' + N(A + '頁347；Lesch; Engländer（原文註127、128）；我國類似見解見王皇玉、余振華。') + '。至於緊急救助，部分支持者認第三人係經被害人授權而取得防衛權，部分則援引' + HL('社會連帶義務') + '（Solidaritätspflicht），認不法侵害者負容忍第三人反擊之法律義務' + N(A + '頁347；Engländer, S. 90-91; Lesch, S. 35-36（原文註130-132）。') + '。'),
    P('《例2》甲、乙、丙、丁四人持槍試圖殺害 A，人數眾多且地處偏僻，A 無其他退避選項，不得已反擊而故意殺死甲，乙、丙、丁因此停止攻擊。依本說，A 之殺人行為係其生命權所衍生之防衛權，甲對之負容忍義務' + N(A + '頁348；Montague, Self-Defense and Choosing Between Lives, 40 PHIL. STUD. 207, 211-13 (1981)（原文註134）。') + '。'),

    I('1、無法回應「防衛權何以能夠侵奪他人生命」：生命是最重要之權利，國家不應施用死刑，個人於緊急情況亦不得將不利益移轉予他人生命（例如 12 人發生海難，仍不得殺死 1 人以供 11 人食用），任何涉及生命之利益衡量均不可能滿足優越利益' + N(A + '頁348-349。') + '。'),
    I('2、無法合理說明第三人防衛權能之規範來源：授權說之問題在於見義勇為之第三人實際上絕大多數未獲本人授權；連帶義務說則只能要求侵害者忍受第三人攻擊，第三人並不因此取得防衛「權利」，造成「本人行使防衛權，第三人則要求侵害者接納其侵害」之理論不一貫' + N(A + '頁349。') + '。'),
    H2('個人利益附加保護說'),
    P('本說認為防衛行為除保護受威脅之法益外，尚保護防衛者' + HL('人格之自由開展利益') + '（Gut der freien Entfaltung der Persönlichkeit），即個人之行為自由（Handlungsfreiheit）；例如甲竊取乙之動產，除侵害財產法益外，尚干擾乙對財產之支配自由，故雙重保護必能符合優越利益' + N(A + '頁350；Wagner, Individualistische oder überindividualistische Notwehrbegründung, S. 31（原文註136、137）。') + '。'),
    P('此說之缺失在於：（1）將概括性人格自主權納入保護對象，與法確證原則同屬摻入無從衡量之抽象價值；（2）竊盜將變成「財產＋行為自由」之侵害，模糊竊盜與強盜罪之界限，強制罪亦將成為所有罪名之基礎規範；（3）仍無法說明正當防衛何以得合法殺人' + N(A + '頁350-351；Frister, GA 1988, S. 300; Fletcher, 8 ISR. L. REV. 367, 377 (1973)（原文註138、139）。') + '。'),
    H2('本文見解：侵害者法益懸置說', 'waiver'),
    H3('出發點：修正法外私力說'),
    P('作者認為，法外私力說能透過自然狀態之歸返解消合法殺人之疑慮，若能調整自然狀態與法秩序之衝突，或可成為新線索。洛克與費希特將視角置於「侵害者」，認違反社會契約者之法權保障暫時懸置' + N(A + '頁351-352。') + '。據此，' + R('不法侵害並非使雙方「全部利益」遁入自然狀態') + '，毋寧僅於「有效反擊不法侵害」之限度內，將侵害者之法益懸置於法秩序保護範域之外。此種「準自然狀態」即正當防衛存在之實質理由' + N(A + '頁352。') + '。'),
    P('《例3》旅客在荒野突然遇到想殺人奪財之搶匪。若仍堅持公權力優先，禁止私人即時自救而強求事後訴訟，無異任憑旅客被殺、被搶；為解決法秩序不能無處不顯之先天困境，實有必要接受特定情狀下之私人暴力' + N(A + '頁353。') + '。'),
    H3('行為規範與人際協和關係'),
    P('所謂' + HL('行為規範') + '（Verhaltensnorm），係國家為保護法益而賦予社會成員之行動指令' + N(A + '頁353；行為規範之說明，參見蔡聖偉，政大法學評論，91期；許恒達，政大法學評論，114期（原文註142）。') + '。惟若僅強調個人服從國家指令，將忽略真正之被害人。行為規範之實質核心在於人與人之相互侵犯與關係破壞：社會成員須放棄以私人暴力奪取或妨害對方之利益，並相互尊重既得利益，此即' + HL('人際協和關係') + '（Koordination），於刑法上推導出互負不侵害對方法益之' + HL('對等尊重義務') + N(A + '頁354-355；Hruschka, Dreher-FS, S. 199-200; Renzikowski, S. 225-226（原文註144、145）。原文註143強調作者主張以結果非價為中心之不法理論。') + '。'),
    P('故不法行為具雙重意義：形式上違犯國家之行為規範，終局效果為國家刑罰（即時階段則為現行犯逮捕、緊急拘提等保全手段）；實質上破壞被害人之協和關係、違犯對等尊重義務' + N(A + '頁355-356。') + '。'),
    H3('協和關係之暫時解消'),
    P('不法侵害即時發生時，雙方對等關係傾斜為侵害者單方支配被害人之' + HL('從屬關係') + '（Subordination）。若仍要求被害人堅守對等尊重義務，顯失公平，形成「內在於法秩序之內的自然狀態悖論」；故協和關係應暫時解消（Suspendierung der Normbefolgungspflichten），被害人不再負對等尊重義務，其反擊即非行為規範所禁止之實質不法行為' + N(A + '頁356-357；Renzikowski, S. 230-232; Hruschka, S. 199-201; Engländer, S. 59（原文註147-150）。') + '。'),
    P('惟須注意：防衛者僅對侵害者解除對等尊重義務，對其他未參與之社會成員仍負相同義務；侵害者亦非全面退出法秩序，僅部分法益懸置於秩序保護之外（partial waiver of the aggressor’s interests）' + N(A + '頁357；Fletcher, supra, at 377（原文註152）。相近觀點：Köhler 稱為不法責任承擔（Unrechtsverantwortung）（原文註153）。') + '。'),
    H3('部分法益懸置與自然狀態之區別'),
    P('所謂' + B('card-pw') + '「' + M('部分法益懸置', 'cmt-ex-5', '【考點】本文核心創見。答題時可依序寫：協和關係 → 不法侵害使其轉為從屬關係 → 對等尊重義務暫時解消 → 侵害者部分法益懸置 → 懸置範圍與侵害強度成正比（類衡平性）。') + '」，與啟蒙理論之自然狀態' + R('迥然不同') + '：後者係毫無法、權秩序之萬人戰萬人情景；前者則係侵害者「全體利益」之絕大部分仍受保障，僅就有效阻止侵害續行所必須侵害之必要利益暫時懸置保護。該等利益既不受法秩序保護，即屬「非法益」（Nicht-Rechtsgut）之利益（Interesse），防衛者侵害之不構成不法；逾越界限者仍屬不法侵害，至多於罪責層次構成' + HL('防衛過當') + '（Notwehrexzess）' + N(A + '頁358。') + '。'),
    P('《例4》甲試圖傷害乙，乙為保護自己打傷甲之手臂，此部分屬保護所必要而懸置，得阻卻違法；惟乙若同時竊取甲身上之手錶，或公然誹謗甲之名譽，與防衛無關，仍構成竊盜罪或誹謗罪' + N(A + '頁359。') + '。'),
    P('對於匿名審查人「法治社會是否可能形成法外空間」之質疑，作者回應：部分法益懸置說並非法外空間，亦非真正之自然狀態，而是' + HL('在法的框架下撤守部分法益保護') + '，其手段限制亦為法之推論結果' + N(A + '頁362註159。') + '。'),
    H3('懸置界限：類優越利益之合比例關係'),
    P('懸置法益之範圍應與不法侵害強度成「' + HL('正比關係') + '」：面對殺人行為得選用干擾較強之手段；僅面臨打臉頰之侵害，只能抓手、推擠，不應刺殺' + N(A + '頁359。') + '。'),
    P('通說之適當性、必要性均未正確反映侵害強度，才會導出「為對抗財產侵害得殺死侵害者」再以社會倫理限制補救之結論' + N(A + '頁359-360。原文註156之例：甲於山腰竊取蘋果，蘋果主人乙合法持獵槍在山腳下，唯一能保護蘋果之方法是射殺甲，依通說仍符合一般防衛手段要求，只是另於社會倫理限制排除。') + '。故防衛手段除適當性、必要性外，應納入' + R('第三項要件：類衡平性') + '（保護法益／損害法益之合比例關係）' + N(A + '頁360；類似見解如 Kühl 之「侵害者利益最適原則」（Grundsatz der möglichsten Schonung des Angreifers），見原文註157。') + '。'),
    H3('與緊急避難之區別'),
    P('緊急避難係兩個均受法秩序保護之利益直接比較價值高低，保護利益須「高於」侵害利益；正當防衛則係侵害者法益部分被懸置，依侵害強度與反擊手段之合比例關係決定，並無價值衡量，嚴格以觀不算優越利益，僅效果上非常類似' + N(A + '頁361-362；原文註160：正當防衛涉及不法侵害者之保護範圍縮減，緊急避難則是合法與合法利益間之權衡及轉嫁，沒有利益縮減問題。') + '。例如甲侵奪乙之財產，乙不得侵害甲之生命，但可有限度侵害輕微身體法益；丙侵害丁之性自主法益，丁之反擊可放大至丙身體重大利益；侵害手段極度強烈時，甚至得懸置侵害者之生命法益' + N(A + '頁361-362。') + '。'),
    H2('小結'),
    Q('正當防衛阻卻違法的實質理由，在於侵害者透過不法行為，改變了其與受侵害之人（防衛者）之間原應相互尊重的人際協和關係，為了讓防衛者不致成為侵害者所支配的客體，並維持其相互對等地位，防衛者於即時受侵害時不再負對等尊重義務，這將使得侵害者的部分法益暫時性地懸置於法秩序保護範圍外。'),
    P('（' + A + '頁362）'),

    /* ---------- 伍 ---------- */
    H1('正當防衛法效的推論'),
    H2('防衛情狀與現在不法侵害'),
    P(DB('問題在於') + '，發動正當防衛是否須侵害者兼具不法及罪責？學理上容有爭議：'),
    I('a. 有採「罪責必要說」（黃榮堅），認為通說既於社會倫理限制中不得優先對無責任能力人防衛，追根究底防衛者只能對有罪責之不法行為防衛，不妨直接以罪責為前提' + N(A + '頁363-364（原文註162）。') + '。此說之缺失在於，誤會通說並非完全排除對無責任能力人之防衛，而係不得「優先」選擇防衛手段；萬一無責任能力人侵害極度強烈（例如精神病患持槍殺人），只許防衛性緊急避難，對防衛者過度苛刻' + N(A + '頁364；Krause, Hilde Kaufmann-GS, S. 681-683（原文註163、164）。') + '。'),
    I('b. 通說採「不法侵害即足說」。'),
    I('c. 本文亦認只需現在不法侵害，蓋協和關係之破壞源自「人本於意志而決定實施不法行為」，只要侵害者實施「可由意志控制的」不法行為，即可歸責其破壞協和關係並承擔法益懸置之即時代價；有無自由之規範認知與服從能力，則屬個人答責之罪責問題' + N(A + '頁363。') + '。'),
    P('作者進一步將無責任能力侵害者分為：（1）未滿 14 歲、（2）因心理或精神疾病欠缺正常認識能力者、（3）出於不可迴避理由欠缺不法意識者。第（2）（3）類攻擊潛能不亞於一般侵害者，不應限制只能緊急避難；第（1）類中 10 歲以下幼童氣力不足，透過侵害／手段之正比例關係即可控制，接近 14 歲者則比照成人處理' + N(A + '頁364-365。原文註165：對「7 歲小孩受極端軍事訓練開槍殺人」之質疑，作者認應優先保護被害人；對審查人「智識不足者無從預見法益懸置」之質疑，作者回應協和關係屬不法層次，且一般人只要了解其將損害他人法益即可。') + '。'),
    H2('防衛手段與類優越利益的合比例衡量'),
    P('適當性、必要性之理由同通說' + N(A + '頁365；黃榮堅（原文註166）。') + '；惟作者主張另須具備' + HL('類衡平性') + '。' + DB('問題在於') + '，若有類衡平性階層，是否推得不得出於正當防衛而殺人？作者認為' + R('在必要限度內仍可合法殺人') + '：懸置法益係侵害者所致，其應自承防衛反擊之風險，不法侵害達極度強烈之臨界值（持電鋸、自動步槍、火箭砲等殺人）時，懸置範圍可上達其生命；惟須侵害者同樣急迫且高度侵犯防衛者之生命法益' + N(A + '頁366-367；Bernsmann, ZStW 104 (1992), S. 311-312（原文註169）。') + '。'),
    P('《例5》侵害者計劃於密室中先禁閉、強制性交、以水果刀在被害人身上劃傷三十餘刀，最後予以餓死。被害人於強制性交結束後、侵害者正準備持刀劃傷時，徒手奪刀刺入侵害者胸口致死。侵害者雖尚未展開真正之殺人行為，惟已實施之侵害已非常接近生命侵害，且可預期後階段之生命干擾，故被害人之殺人手段仍符合合比例關係而阻卻違法' + N(A + '頁367；原文註170：德國學說亦傾向僅涉及高度人格利益時始許可持用攻擊型武器，且應優先射擊非致命部位（NK-StGB-Herzog, § 32 Rn. 74, 76）。對審查人「準自然狀態可否證成死刑」之質疑，作者回應死刑欠缺緊急事態，且屬公力介入之刑罰執行，兩者論證理由本質不同。') + '。'),
    P('反之，侵害者單純干擾身體或財產利益時，不得實施殺人之防衛手段。對於「低度侵害時防衛者可能毫無合法手段」之批評，作者回應：要將利益除外於保護之外須有堅實理由，侵害干擾極度有限時，仍應回歸事後民事或刑事訴訟救濟' + N(A + '頁368；原文註172：個人 100 萬元價金請求權受即時違約侵害時，除合於自救行為（Selbsthilfe）要件外亦只能暫時忍受再事後救濟，1 顆蘋果之利益並不比其大。') + '。'),
    P('故通說社會倫理限制中之「懸殊不合比例」類型，正好印證本文看法；惟合比例關係應為' + HL('所有防衛行為合法要件之通案標準') + '，而非僅於特定個案藉社會倫理限制處理' + N(A + '頁368-369；原文註171：作者同意審查人所指，正當防衛與防衛性緊急避難之差異僅有程度區別，與攻擊性緊急避難則因轉嫁第三人而操作結果有別。') + '。'),
    H2('退避義務', 'retreat'),
    H3('一般情形'),
    P('通說以法確證原則推論防衛者不負' + B('card-aw') + '退避義務。作者' + R('結論相同，理由不同') + '：侵害者部分利益既已懸置而喪失法益屬性，防衛者優先侵害之並不違反對等尊重義務，此係懸置之必然推論，並非源自法確證原則之抽象信仰' + N(A + '頁369-370。') + '。'),
    P('有學說（佐伯仁志）認為，任何防衛者均負優先退避義務，以求雙方利益最大值' + N(A + '頁370；佐伯仁志（著），黃士軒（譯），日本正當防衛論之新開展，月旦法學雜誌，177期，頁171-175，2010年（原文註175）。') + '。此說之缺失在於：（1）過度保護侵害者，加劇協和關係之失衡；（2）未履行退避義務者即使手段完全符合三項要件仍不能阻卻違法，強加無理負擔；（3）退避不必然有效，且可能離開第一現場而失去反擊工具，反而成為兩敗俱傷之肇生原因。'),
    P('《例6》甲要殺乙，乙未先「設法逃離現場」，即持木棍打傷甲而終止攻擊。若要求乙先逃離，可能逃到沒有木棍之處，甲步步進逼，乙反擊失能而可能被殺' + N(A + '頁370-371。') + '。'),
    P('另有修正見解認為，僅於殺人之防衛手段時例外肯定退避義務；作者認採殺人手段者通常已是極度強烈且難以有效退避之侵害，仍要求先撤離，對防衛者之保護極端不足' + N(A + '頁371（原文註176）。') + '。'),
    H3('親密親屬關係'),
    P('此見解由德國實務發展，認丈夫不法侵害妻子時，妻子負退避義務' + N(A + '頁372；Wohlers, JZ 1999, S. 434-435（原文註177、178）。') + '。其理由有二：'),
    I('a. 保證人地位說（Roxin）：保證人陷入「應保護對方／得反擊對方」之緊張關係。此說之缺失在於，保證人地位類型眾多，被承認為社會倫理限制者卻只有最近親屬（例如主治醫師與住院病患即未列入），可見保證人地位並非實質理由' + N(A + '頁372；Engels, GA 1982, S. 113；進一步批評見薛智仁，家暴事件的正當防衛難題，中研院法學期刊，16期（原文註182、183）。') + '。'),
    I('b. 社會連帶說（Wohlers）：最近親屬應為對方優先著想。此說之缺失在於，等同強加親密親屬更高程度之社會連帶義務，違反通說「最低底限社會連帶」之說法，並將婚姻生活相互忍讓之道德訴求全面變成法律責任，使婚姻關係中之個人受到較少保護，違反婚姻制度增進伴侶幸福之目的' + N(A + '頁372-373（原文註184-188）。') + '。'),
    I('c. 本文認應依一般正當防衛規範決定手段界限，類衡平性即足以解決：夫妻小爭吵拳腳相向時，至多推開對方；一方持刀殺人或點燃瓦斯準備同歸於盡時，另一方可採高強度反擊' + N(A + '頁373-374。') + '。'),
    H3('挑唆防衛'),
    P('作者認為挑唆防衛是' + HL('唯一可以限制正當防衛「果斷且無須遲疑」特性之事由') + '，挑唆者負退避義務，並遵守三階段論' + N(A + '頁374；Stuckenberg, JA 2002, S. 174-175（原文註189）。') + '，蓋：'),
    I('1、挑唆者與侵害者共同破壞協和關係，若僅令侵害者單方懸置法益，對侵害者不公平；故挑唆者不立即免除相互尊重義務，須先退避，退避無效始得防衛，且優先保護式防衛' + N(A + '頁374-375；陳俊榕，論「挑唆防衛」，國立中正大學法學集刊，39期，頁97-100，2013年（原文註191）。') + '。'),
    I('2、' + R('不區分意圖式與非意圖式') + '：意圖式挑唆者並未如間接正犯般完全支配被挑唆者，被挑唆者仍出於自由意志實施不法行為，將協和關係之破壞一律歸諸挑唆者並不合理。故意圖式挑唆者仍有防衛權限，與非意圖式同負退避義務' + N(A + '頁375-376；Roxin, Täterschaft und Tatherrschaft, S. 142-148, 170-179（原文註194）。作者並表示挑唆防衛議題將另行撰文分析（原文註195）。') + '。'),
    H2('緊急救助'),
    P('通說以刑法第 23 條「防衛……他人權利」之明文及法確證原則為雙重論理' + N(A + '頁376-377；林山田；Roxin, AT I, § 15 Rn. 116（原文註196、197）。') + '。本文則認為，' + B('card-nh') + '緊急救助阻卻違法之理由有二：（一）侵害者／受害者關係中，侵害者部分法益已因協和關係破壞而懸置；（二）侵害者／第三人關係中，侵害者本於' + HL('社會連帶義務') + '負相同之規範負擔' + N(A + '頁377-380；Renzikowski, S. 296（原文註199、200）。') + '。'),
    P('《例7》甲因車禍重傷，路過之乙利用此情狀試圖強行奪取甲之金項鍊。甲雖可合法反擊，但已喪失反擊能力；若不許碰巧路過之丙見義勇為協助反擊乙，甲即陷於法益無從保護之狀態。故乙對丙負社會連帶義務，須接受丙之合法反擊' + N(A + '頁378。') + '。'),
    P(DB('問題在於') + '，作者既反對以社會連帶義務限制防衛手段，何以於此又支持之？作者區分兩種社會連帶義務：法律化之社會連帶義務只能推論「' + HL('對於他人適度侵害必須忍受') + '」，不能推導「' + HL('未顧慮或保護他人利益必須受罰') + '」；前者僅要求侵害者消極容忍，後者則把未盡社會連帶義務當作處罰理由，逾越法律化之適度界限' + N(A + '頁378-379；Neumann; Joerden（原文註203-205）。') + '。'),
    P('第三人仍須具主觀防衛意識；欠缺者屬' + HL('偶然防衛') + '，仍應考慮成立未遂犯' + N(A + '頁379；林鈺雄；王皇玉；Roxin, AT I, § 14 Rn. 104-106（原文註206）。') + '。至於第三人之防衛係「傳來權利」之論爭，作者認關鍵並非權利讓渡，而是懸置法益效果透過社會連帶義務之擴張，故此爭議實無太大意義' + N(A + '頁380-381。') + '。'),
    P('關於強施救助，作者不完全贊同通說，區分：（1）受害者自願接受侵害、已將意願告知侵害者，且其對該法益有處分權者，侵害行為阻卻違法，已無防衛情狀，第三人反擊構成' + HL('誤想防衛') + '（Putativnotwehr）而論以過失刑責；（2）受害者內心雖有類似想法但未表達於外，尤其未告知侵害者者，仍有防衛情狀，第三人得合法攻擊侵害者' + N(A + '頁380-381；防衛情狀係從事後（ex post）角度綜整所有事實判斷（原文註208）。') + '。'),
    H2('正當防衛與其社會倫理限制'),
    P(DB('問題在於') + '，社會倫理限制是否違反罪刑法定主義？'),
    I('a. 否定說（Sinn; Erb）：正當防衛納入內容不明確之限制，不符明確性原則並擴大成罪，須有法律明文授權；我國刑法第 23 條既無社會倫理限制用語，亦無德國「合宜性」之規定，自不得附加' + N(A + '頁381；Sinn, Wolter-FS, S. 514-518; Erb, ZStW 108 (1996), S. 294-299（原文註211-213）。') + '。'),
    I('b. 本文認為不直接違反罪刑法定主義：社會倫理限制實為適當性、必要性以外之第三種手段要件；刑法第 23 條但書「防衛行為過當者，得減輕或免除其刑」顯示立法者認防衛手段有「允當／過當」之法定區別，至於何謂允當則由學說、實務續造，自不妨於必要性外再附加第三項手段要求' + N(A + '頁382；Heinrich, AT, Rn. 360（原文註214）。') + '。'),
    P('惟' + R('合法不等於適合') + '。作者認為四類中除挑唆防衛外均不足以構成手段限制；而挑唆防衛之限制亦非出於「社會倫理」或「最底限社會連帶」之道德訴求，而係出於法之理由，即挑唆者對不法侵害與有責任，依刑法第 23 條但書之反面解釋負退避義務' + N(A + '頁382-383。') + '。故作者主張：'),
    Q('所謂社會倫理限制也應該理解或改稱為：「挑唆防衛者對不法侵害與有責任的手段限制」。'),
    TREE(TN('社會倫理限制（通說四類）', [
      TN('無責任能力人', [], '本文：以合比例關係控制即可'),
      TN('利益懸殊', [], '本文：屬類衡平性之通案標準'),
      TN('親密親屬', [], '本文：否定，回歸一般規範'),
      TN('挑唆防衛', [], '本文：保留；改稱與有責任之手段限制')
    ])),

    /* ---------- 陸 ---------- */
    H1('結論', 'concl'),

/* =========================================================
   範例資料移入「0. 範例」（舊檔自動搬移）
   ========================================================= */
function migrateExample(d) {
  try {
    const st = d.slipbox && d.slipbox.tree;
    const hasId = (nodes, id) => nodes.some(n => n.id === id || hasId(n.children || [], id));
    if (st && !hasId(st, 'cf-sample')) {
      const i = st.findIndex(n => n.id === 'cf-crim' && hasId(n.children || [], 'card-sd'));
      if (i >= 0) {
        const crim = st.splice(i, 1)[0];
        st.unshift({ id: 'cf-sample', type: 'cfolder', name: '範例', zero: true, open: true, children: [crim] });
      }
    }
    if (!d.notes || !d.notes['note-example'] || hasId(d.tree, 'folder-sample')) return;
    let exNode = null;
    const pull = nodes => {
      for (let k = 0; k < nodes.length; k++) {
        const n = nodes[k];
        if (n.id === 'note-example') { exNode = nodes.splice(k, 1)[0]; return true; }
        if (n.children && pull(n.children)) {
          if (n.id === 'folder-crim' && !n.children.length) nodes.splice(k, 1);
          return true;
        }
      }
      return false;
    };
    pull(d.tree);
    if (!exNode) return;
    const mi = d.tree.findIndex(n => n.id === 'note-manual');
    d.tree.splice(mi + 1, 0, { id: 'folder-sample', type: 'folder', name: '範例', open: true, children: [exNode] });
  } catch (e) { /* 搬移失敗不影響載入 */ }
}

function computeAllBacklinks() {
  commitCurrent();
  computeCardNos();
  const out = new Map();
  const push = (cid, l) => { if (!out.has(cid)) out.set(cid, []); out.get(cid).push(l); };
  const scan = (html, cb) => {
    if (!html || html.indexOf('card-badge') < 0) return;
    const t = document.createElement('template'); t.innerHTML = html;
    let chapter = '';
    const idx = new Map();
    t.content.querySelectorAll('h1, h2, h3, h4, h5, h6, .card-badge').forEach(el => {
      if (/^H[1-6]$/.test(el.tagName)) {
        if (el.dataset.cont) return;
        const c = el.cloneNode(true); c.querySelectorAll('.card-badge, sup').forEach(x => x.remove());
        chapter = c.textContent.replace(/\s+/g, ' ').trim(); return;
      }
      const cid = el.dataset.cardId; if (!cid) return;
      const i = idx.get(cid) || 0; idx.set(cid, i + 1);
      cb(cid, el, i, chapter);
    });
  };
  const walk = nodes => nodes.forEach(n => {
    if (n.type === 'note') scan(data.notes[n.id] && data.notes[n.id].html, (cid, b, i, chapter) => push(cid, { type: 'note', id: n.id, label: n.name, chapter, ctx: badgeContext(b), index: i }));
    if (n.children) walk(n.children);
  });
  walk(data.tree);
  allCards().forEach(c => scan(c.html, (cid, b) => { if (cid !== c.id) push(cid, { type: 'card', id: c.id, label: cardLabel(c), ctx: badgeContext(b) }); }));
  return out;
}

const NUM_PREFIX_RE = /^(?:[壹貳參肆伍陸柒捌玖拾佰]+|[一二三四五六七八九十百]+|[0-9０-９]+|[A-Za-zＡ-Ｚａ-ｚ]|[ivxlcIVXLC]+)[、．.]\s*|^[（(](?:[壹貳參肆伍陸柒捌玖拾一二三四五六七八九十百]+|[0-9０-９]+|[A-Za-z]|[ivxlcIVXLC]+)[）)]\s*/;
function headParts(h) {
  const c = h.cloneNode(true);
  const numEl = c.querySelector(':scope > .ol-num');
  const num = numEl ? numEl.textContent.trim() : '';
  if (numEl) numEl.remove();
  c.querySelectorAll('.card-badge, sup, .img-wrap, .math, .ol-num').forEach(x => x.remove());
  let t = c.textContent.replace(/\s+/g, ' ').trim();
  /* 自動編號已開啟時，若標題文字本身又手打了編號（如「壹、」），只保留一份，避免目錄疊字 */
  if (num) {
    if (t.startsWith(num)) t = t.slice(num.length).trim();
    else { const m = NUM_PREFIX_RE.exec(t); if (m && m[0].replace(/\s/g, '') === num.replace(/\s/g, '')) t = t.slice(m[0].length).trim(); }
  }
  return { num, t: t || '（空白標題）' };
}
function headText(h) { const p = headParts(h); return (p.num ? p.num : '') + p.t; }
function collectHeads() {
  return [...pagesEl.querySelectorAll('.page-body h1, .page-body h2, .page-body h3, .page-body h4, .page-body h5, .page-body h6')]
    .filter(h => !h.dataset.cont && !h.closest('td, th, .td-box, .tree-diagram'));

function buildNav() {
  if (navPane.hidden) return;
  const heads = data.activeId ? collectHeads() : [];
  const items = heads.map(h => { const hp = headParts(h); return { h, lv: Math.min(9, Math.max(1, headingLevel(h))), p: hp, t: hp.num + hp.t }; });
  const sig = (data.activeId || '') + '¦' + items.map(x => x.lv + ':' + x.t).join('¦');
  navHeads = items.map(x => x.h);
  if (sig === navSig) { updateNavActive(); return; }
  navSig = sig;
  navList.innerHTML = '';
  if (!items.length) {
    navList.innerHTML = '<li class="np-empty">' + (data.activeId ? '本篇尚無標題。<br>以工具列「本文段落（P）」選單將段落設為標題後，會自動列在這裡。' : '目前沒有開啟中的筆記。') + '</li>';
    return;
  }
  const minLv = Math.min(...items.map(x => x.lv));
  const stack = [{ lv: 0, ul: navList }];
  const seen = new Map();
  items.forEach((x, i) => {
    while (stack.length > 1 && stack[stack.length - 1].lv >= x.lv) stack.pop();
    const parent = stack[stack.length - 1];
    const li = document.createElement('li');
    const base = x.lv + '|' + x.t;

    row.innerHTML = '<span class="np-tg"></span><span class="np-t"><span class="np-n"></span><span class="np-s"></span></span>';
    row.querySelector('.np-n').textContent = x.p.num;
    row.querySelector('.np-s').textContent = x.p.t;
    row.title = x.t;
    li.appendChild(row);
    parent.ul.appendChild(li);

/* =========================================================
   四、單篇筆記／資料夾的匯出與匯入
   ========================================================= */
const EXPORT_FORMAT = 'a4-academic-notes';
function badgeIdsIn(html, set) {
  if (!html || html.indexOf('card-badge') < 0) return;
  const t = document.createElement('template'); t.innerHTML = html;
  t.content.querySelectorAll('.card-badge').forEach(b => { if (b.dataset.cardId) set.add(b.dataset.cardId); });
}

  const want = new Set();
  noteIds.forEach(id => badgeIdsIn(data.notes[id] && data.notes[id].html, want));
  /* 卡片之間互相引用者一併帶上 */
  let grew = true;
  while (grew) {
    grew = false;
    [...want].forEach(id => {
      const f = findCard(id); if (!f) return;
      const before = want.size;
      badgeIdsIn(f.node.html, want);
      collectIds(f.node).forEach(id => want.add(id));
      (f.node.relatedIds || []).forEach(id => want.add(id));
      if (want.size > before) grew = true;
    });

  want.forEach(id => { const f = findCard(id); if (f) collectIds(f.node).forEach(x => keep.add(x)); });

    const kids = prune(n.children || []);
    if (!keep.has(n.id) && !kids.length) return null;
    const c = Object.assign({}, n, { children: kids });
    return c;
  }).filter(Boolean);

}

  commitCurrent();
  const root = JSON.parse(JSON.stringify(node));
  const noteIds = collectIds(node).filter(id => data.notes[id]);
  const notes = {};
  noteIds.forEach(id => { notes[id] = JSON.parse(JSON.stringify(data.notes[id])); });
  const cards = cardSubsetFor(noteIds);
  const bundle = { format: EXPORT_FORMAT, version: 1, exportedAt: new Date().toISOString(), kind: node.type, title: node.name, root, notes, slipbox: cards.tree };
  const blob = new Blob([JSON.stringify(bundle)], { type: 'application/json' });
  downloadBlob(blob, safeFileName(node.name) + '.a4notes.json');
  toast('已匯出「' + node.name + '」：' + noteIds.length + ' 篇筆記' + (cards.count ? '、' + cards.count + ' 張相關卡片' : ''), 4000);
}

}

const HIST_MAX = 100;
const histories = new Map();      /* noteId → { stack: [{ html, comments, caret, scroll }], idx } */

function snapState() {

}

/* 鍵盤：Ctrl+Z 復原、Ctrl+Y／Ctrl+Shift+Z 重做（在輸入框、便條、卡片抽屜內維持瀏覽器原生行為） */

/* =========================================================
   資源回收筒：左側筆記／資料夾／卡片刪除後可復原

const TRASH_MAX = 60, TRASH_DAYS = 30;

function dataUrlBytes(src) {
  const m = String(src).match(/^data:(image\/[\w+.-]+);base64,(.*)$/);
  if (!m) return null;
  const bin = atob(m[2]);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return { mime: m[1], data: u };
}
function imageToBytes(img) {
  const d = dataUrlBytes(img.src);
  if (d && (d.mime === 'image/png' || d.mime === 'image/jpeg')) return Promise.resolve(d);
  return new Promise(res => {
    try {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth || 1; c.height = img.naturalHeight || 1;
      c.getContext('2d').drawImage(img, 0, 0);
      c.toBlob(b => b.arrayBuffer().then(ab => res({ mime: 'image/png', data: new Uint8Array(ab) })), 'image/png');
    } catch (_) { res(null); }
  });
}

function serializeDocument() {
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#notes-data').textContent = JSON.stringify(data).replace(/</g, '\\u003c');
  ['#pages', '#comment-rail', '#tree', '#comment-connector-canvas', '#ctx-bar', '#swatches', '#tp-grid', '#cd-title', '#cd-body', '#cd-no', '#cd-path', '#cd-chain', '#cd-backlinks', '#np-list', '#gv-tree', '#pw-relations'].forEach(s => {
    const n = clone.querySelector(s); if (n) n.innerHTML = '';
  });
  ['#ctx-bar', '#table-picker', '#graph-overlay'].forEach(s => { const n = clone.querySelector(s); if (n) n.setAttribute('hidden', ''); });
  const dr = clone.querySelector('#card-drawer'); if (dr) { dr.classList.remove('open'); dr.removeAttribute('style'); }
  const cb2 = clone.querySelector('#cd-back'); if (cb2) cb2.setAttribute('hidden', '');
  clone.querySelectorAll('.td-allsel, .img-wrap.sel, .rz-e, .rz-s, .rz-se').forEach(n => n.classList.remove('td-allsel', 'sel', 'rz-e', 'rz-s', 'rz-se'));
  clone.querySelectorAll('#dlg-overlay, #pop-menu, body > a[download]').forEach(n => n.remove());
  clone.querySelectorAll('#sel-font option').forEach(o => { o.textContent = FONT_DEFS[o.value].label; });
  clone.querySelectorAll('.sb-tab').forEach(t => t.classList.toggle('on', t.dataset.tab === 'notes'));
  const st = clone.querySelector('#save-status'); if (st) st.setAttribute('data-state', 'ready');
  const stt = clone.querySelector('#save-status-text'); if (stt) stt.textContent = '已就緒';
  const t = clone.querySelector('#toast'); if (t) { t.textContent = ''; t.className = ''; }
  const title = clone.querySelector('title'); if (title) title.textContent = APP_TITLE;
  const body = clone.querySelector('body'); if (body) body.removeAttribute('class');
  clone.removeAttribute('class');
  clone.removeAttribute('style');
  clone.querySelectorAll('#block-handle, #undo-bar').forEach(n => n.remove());
  clone.querySelectorAll('.del-pending').forEach(n => n.classList.remove('del-pending'));
  ['#sticky-layer', '#ref-body', '#ref-select', '#cite-menu'].forEach(sel => { const n = clone.querySelector(sel); if (n && sel !== '#cite-menu') n.innerHTML = ''; });
  ['#find-bar', '#ref-pane', '#ref-divider', '#cite-menu'].forEach(sel => { const n = clone.querySelector(sel); if (n) n.setAttribute('hidden', ''); });
  const rp = clone.querySelector('#ref-pane'); if (rp) rp.removeAttribute('style');
  const fb = clone.querySelector('#find-bar'); if (fb) { fb.removeAttribute('style'); fb.className = ''; }
  clone.querySelectorAll('#fb-q, #fb-r').forEach(i => i.removeAttribute('value'));
  const wc = clone.querySelector('#btn-wc'); if (wc) wc.textContent = '字數 0';
  const tc = clone.querySelector('#tray-count'); if (tc) tc.textContent = '0';
  clone.querySelectorAll('#btn-split.active').forEach(b => b.classList.remove('active'));
  const dw = clone.querySelector('#doc-wrap'); if (dw) dw.removeAttribute('style');
  const ss = clone.querySelector('#save-status'); if (ss) ss.removeAttribute('data-perm');
  const zv = clone.querySelector('#zoom-val'); if (zv) zv.textContent = '100% ▾';
  clone.querySelectorAll('#zoom-fit.active, #btn-navpane.active').forEach(b => b.classList.remove('active'));
  const sb = clone.querySelector('#sidebar'); if (sb) sb.classList.remove('file-drop');
  clone.querySelectorAll('#import-input').forEach(n => n.remove());
  /* 安全檢查：原始介面中的元件一個都不能少，否則寧可不寫入，避免寫出無法開啟的檔案 */
  const missing = STATIC_IDS.filter(id => !clone.querySelector('#' + CSS.escape(id)));
  if (missing.length) throw new Error('存檔內容檢查失敗（缺少介面元件：' + missing.slice(0, 5).join('、') + '），已停止寫入以保護檔案');
  return '<!DOCTYPE html>\n' + clone.outerHTML;
}

async function hasPermission(handle, request) {
  if (!handle || !handle.queryPermission) return !!handle;
  const opts = { mode: 'readwrite' };
  let q = '', r = '';
  try {
    q = await handle.queryPermission(opts);
    if (q === 'granted') return true;
    if (request) { r = await handle.requestPermission(opts); if (r === 'granted') { diag('允許寫入', 'query=' + q + ' → request=granted'); return true; } }
  } catch (e) { r = (e && e.name) + ' ' + (e && e.message); }
  if (request) { lastPermInfo = 'query=' + q + ' → request=' + r; diag('允許寫入', '未獲允許：' + lastPermInfo); }
  return false;
}

function markDirty() {
  if (!data) return;
  dirty = true;
  editSeq++;
  data.updatedAt = Date.now();
  const perm = $('#save-status').dataset.perm === 'ask';
  setStatus('dirty', fileHandle ? (perm ? '有未儲存的變更｜按 ' + SAVE_KEY + ' 允許寫回 ' + fileHandle.name : '有未儲存的變更') : '有未儲存的變更（內容已暫存於瀏覽器）');
  scheduleSnapshot();
  clearTimeout(autoTimer);
  autoTimer = setTimeout(autoSave, 1500);
}

async function autoSave() {
  if (PW_MODE) return pwSave();
  commitCurrent();
  saveDraft();
  if (fileHandle && await hasPermission(fileHandle, false)) { if (await verifyRememberedFile()) await writeFile(); }
  else if (dirty) setStatus('dirty', '已暫存於瀏覽器 ' + nowHMS() + '（按 Ctrl+S 寫入檔案）');
}

async function writeFile() {
  if (writing) { pendingWrite = true; return true; }
  writing = true;
  const seq = editSeq;
  setStatus('saving', '正在寫入…');
  let ok = false;
  try {
    const html = serializeDocument();
    const w = await fileHandle.createWritable();
    await w.write(new Blob([html], { type: 'text/html' }));
    await w.close();
    if (seq === editSeq) { dirty = false; clearDraft(); }
    delete $('#save-status').dataset.perm;
    setStatus(dirty ? 'dirty' : 'saved', dirty ? '有未儲存的變更' : '已儲存於 ' + nowHMS() + '（' + fileHandle.name + '，之後 ' + SAVE_KEY + ' 直接寫回）');
    ok = true;
  } catch (err) {
    const name = err && err.name;
    /* 原檔案已被移動、刪除、改名或被其他程式鎖住：放棄記住的檔案，請使用者重新指定 */
    if (name === 'NotFoundError') {
      await dropFileHandle();
      setStatus('error', '找不到原檔案（可能已搬移或改名），請按「另存」重新選擇（內容已暫存於瀏覽器，不會遺失）');
    } else setStatus('error', '寫入失敗（' + (name || '') + '）：' + (err && err.message ? err.message : err) + '；再按一次 Ctrl+S 重試（內容已暫存於瀏覽器）');
    toast('寫入失敗：' + (err && err.message ? err.message : name || err), 5000);
  } finally {
    writing = false;
    if (pendingWrite) { pendingWrite = false; if (fileHandle) writeFile(); }
  }
  return ok;
}
async function dropFileHandle() {
  fileHandle = null; handleVerified = false;
  try { await forgetHandle(); } catch (_) { /* 忽略 */ }
}

function downloadFallback(primary) {
  downloadBlob(new Blob([serializeDocument()], { type: 'text/html' }), fileName || defaultFileName());
  if (primary) { dirty = false; clearDraft(); setStatus('saved', '已下載於 ' + nowHMS() + '（此瀏覽器不支援直接寫回原檔）'); return; }
  setStatus('dirty', '已另外下載一份到「下載」資料夾（' + nowHMS() + '）；原檔案尚未更新');
}

async function pickSaveHandle() {
  const base = { suggestedName: fileName || defaultFileName(), types: [{ description: 'HTML 筆記檔', accept: { 'text/html': ['.html', '.htm'] } }] };
  try {
    /* 有記住的檔案時從它所在的資料夾開始；否則交給瀏覽器開在上次使用的資料夾（通常就是原檔所在處） */
    return await window.showSaveFilePicker(fileHandle ? Object.assign({ startIn: fileHandle }, base) : base);
  } catch (err) {
    if (err && err.name === 'AbortError') throw err;
    /* 記住的位置失效（檔案搬移、刪除）時，改用最單純的選檔視窗 */
    return await window.showSaveFilePicker(base);
  }
}

      const h = await pickSaveHandle(); fileHandle = h; fileName = h.name; handleVerified = true; await rememberHandle(h);

      return;

    if (!(await verifyRememberedFile())) {

      else { setStatus('dirty', '已取消寫入，可用「另存」保存'); return; }

    await writeFile();
  } catch (err) {
    if (err && err.name === 'AbortError') { setStatus(dirty ? 'dirty' : 'ready', dirty ? '有未儲存的變更（內容已暫存於瀏覽器）' : '已就緒'); return; }
    setStatus('error', '儲存失敗（' + (err && err.name || '') + '）：' + (err && err.message ? err.message : err) + '（內容已暫存於瀏覽器）');
  }
}

  await writeFile();
