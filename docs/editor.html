<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta id="pw-hosted-csp" http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Cg/CB4wfQvw5GI9n7Shgee92Au+M0FgQZB0gUusIvtM='; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A4 學術筆記編輯器</title>
<style>
:root{
  --font-pming:"Times New Roman", Times, "PMingLiU", "新細明體", serif;
  --font-ming:"Times New Roman", Times, "MingLiU", "細明體", "Apple LiSung", "LiSong Pro", serif;
  --font-song:"Times New Roman", Times, "SimSun", "宋体", "Songti TC", "STSong", serif;
  --font-kai:"Times New Roman", Times, "DFKai-SB", "標楷體", "BiauKai", "BiauKaiTC", "BiauKaiHK", "Kaiti TC", "TW-Kai", "KaiTi", "STKaiti", serif;
  --ui-font:system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --workspace:#f3f4f6;
  --line:#e5e7eb;
  --text:#1f2937;
  --muted:#64748b;
  --accent:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;font-family:var(--ui-font);color:var(--text);background:var(--workspace);overflow:hidden}

/* ---------- 頂部工具列 ---------- */
#toolbar{position:sticky;top:0;z-index:1000;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px 12px;background:#f8fafc;border-bottom:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06);user-select:none}
.tb-group{display:flex;align-items:center;gap:3px;position:relative}
.tb-sep{width:1px;height:24px;background:#cbd5e1;margin:0 5px}
.tb-btn{height:30px;padding:0 9px;border:1px solid transparent;border-radius:6px;background:transparent;font:13px var(--ui-font);color:#334155;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.tb-btn:hover{background:#e2e8f0}
.tb-btn.active{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
.tb-btn.primary{background:#2563eb;color:#fff}
.tb-btn.primary:hover{background:#1d4ed8}
.tb-btn.ic{padding:0 6px}
.tb-btn b,.tb-btn u{font-family:"Times New Roman",serif;font-size:15px}
.hl-swatch{background:#fef08a;padding:1px 5px;border-radius:2px}
.tb-select{height:30px;padding:0 6px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;font:13px var(--ui-font);color:#334155;cursor:pointer}
.tb-label{font-size:12px;color:var(--muted);margin:0 2px 0 4px}
.swatches{display:flex;gap:3px;padding:0 2px}
.sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.sw.active{outline:2px solid #2563eb;outline-offset:1px}
.status{margin-left:auto;gap:7px;font-size:12.5px;color:#475569;padding:0 4px}
.status .dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;flex-shrink:0}
.status[data-state="dirty"] .dot{background:#f59e0b}
.status[data-state="saving"] .dot{background:#3b82f6;animation:pulse 1s infinite}
.status[data-state="saved"] .dot{background:#22c55e}
.status[data-state="error"] .dot{background:#ef4444}
@keyframes pulse{50%{opacity:.3}}
#table-picker{position:absolute;top:36px;left:0;z-index:1100;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px}
#table-picker[hidden]{display:none}
.tp-grid{display:grid;grid-template-columns:repeat(10,16px);gap:3px}
.tp-cell{width:16px;height:16px;border:1px solid #cbd5e1;border-radius:2px;background:#fff;cursor:pointer}
.tp-cell.on{background:#bfdbfe;border-color:#3b82f6}
.tp-label{font-size:12px;color:#475569;text-align:center;margin-top:6px}

/* ---------- 主體配置 ---------- */
#app{flex:1;display:flex;min-height:0}
#sidebar{width:260px;flex-shrink:0;display:flex;flex-direction:column;background:#f9fafb;border-right:1px solid var(--line);transition:width .2s ease;overflow:hidden}
body.sidebar-collapsed #sidebar{width:0;border-right:none}
.sb-tabs{display:flex;gap:4px;padding:10px 12px 0;min-width:260px}
.sb-tab{flex:1;height:30px;border:1px solid #e2e8f0;background:#fff;border-radius:7px;font:12.5px var(--ui-font);color:#475569;cursor:pointer}
.sb-tab.on{background:#e0e7ff;border-color:#c7d2fe;color:#3730a3;font-weight:600}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;min-width:260px}
.sb-title{font-size:13px;font-weight:700;color:#475569;letter-spacing:.05em}
.sb-actions{display:flex;gap:4px}
#trash-bar{flex-shrink:0;min-width:260px;display:flex;align-items:center;gap:6px;border:none;border-top:1px solid var(--line);background:#f3f4f6;color:#64748b;font:12.5px var(--ui-font);padding:8px 14px;cursor:pointer;text-align:left}
#trash-bar:hover{background:#e9edf3;color:#0f172a}
#trash-count{background:#e2e8f0;color:#475569;border-radius:9px;padding:0 7px;font-size:11px}
#trash-bar.has #trash-count{background:#fde68a;color:#92400e}
.trash-box{max-height:60vh;overflow:auto;min-width:min(620px,80vw)}
.trash-row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #f1f5f9}
.tr-main{flex:1;min-width:0}
.tr-name{font-size:14px;color:#0f172a;word-break:break-word}
.tr-meta{font-size:11.5px;color:#94a3b8;margin-top:2px}
.trash-empty{color:#94a3b8;padding:24px 8px;text-align:center;line-height:1.8}
.sb-btn{height:26px;padding:0 8px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;font:12px var(--ui-font);color:#334155;cursor:pointer}
.sb-btn:hover{background:#eef2ff;border-color:#c7d2fe}
#sidebar.file-drop{outline:2px dashed #3b82f6;outline-offset:-4px;background:#eff6ff}
#sidebar.file-drop #tree::before{content:"放開以匯入筆記檔";display:block;margin:10px 12px;padding:10px;border-radius:8px;background:#dbeafe;color:#1d4ed8;font-size:13px;text-align:center}
.tb-btn:disabled{opacity:.38;cursor:default;background:transparent}
.tb-group.zoom .zb{min-width:28px;padding:0 6px;font-weight:600}
#zoom-val{min-width:64px}
#save-status[data-state="error"] #save-status-text,#save-status[data-perm="ask"] #save-status-text{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
#tree{position:relative;list-style:none;margin:0;padding:4px 6px 40px;overflow:auto;flex:1;min-width:260px}
#tree ul{list-style:none;margin:0;padding:0}
.tree-row{display:flex;align-items:center;gap:4px;height:29px;padding-right:4px;border-radius:6px;cursor:pointer;font-size:13.5px;color:#334155;user-select:none}
.tree-row:hover{background:#eef2f7}
.tree-row.selected{background:#f1f5f9}
.tree-row.active{background:#e0e7ff;color:#3730a3;font-weight:600}
.tree-row.dragging{opacity:.4}
.tree-row.drop-inside{background:#dbeafe;box-shadow:inset 0 0 0 2px #3b82f6,0 0 10px rgba(59,130,246,.45)}
#drop-line{position:absolute;height:2px;background:#3b82f6;border-radius:1px;pointer-events:none;display:none;z-index:5}
#drop-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#3b82f6}
.tw{width:14px;text-align:center;color:#94a3b8;font-size:11px;flex-shrink:0}
.ti{display:flex;flex-shrink:0}
.tn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:3px;padding:1px 2px}
.tn .no{color:#64748b;margin-right:5px;font-family:"Times New Roman",serif;font-variant-numeric:tabular-nums}
.tn .nm{outline:none}
.tn .nm[contenteditable="true"]{background:#fff;box-shadow:0 0 0 1.5px var(--accent);border-radius:2px;cursor:text;padding:0 2px}
.ta{display:none;gap:1px;flex-shrink:0}
.tree-row:hover .ta{display:flex}
.ta button{min-width:24px;height:22px;border:none;border-radius:4px;background:transparent;color:#475569;cursor:pointer;font-size:11px;padding:0 2px;white-space:nowrap}
.ta button:hover{background:#cbd5e1;color:#0f172a}
.tree-empty{padding:16px 12px;font-size:12.5px;color:#94a3b8;line-height:1.7}
#pop-menu{position:fixed;z-index:3100;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;min-width:140px}
#pop-menu button{display:block;width:100%;text-align:left;height:30px;padding:0 12px;border:none;border-radius:5px;background:transparent;font:13px var(--ui-font);color:#334155;cursor:pointer}
#pop-menu button:hover{background:#f1f5f9}
#pop-menu button.danger{color:#dc2626}
#pop-menu button.danger:hover{background:#fee2e2}

#workspace{flex:1;overflow:auto;scroll-behavior:smooth;background:var(--workspace)}
#doc-wrap{position:relative;display:flex;justify-content:center;gap:20px;padding:32px 24px 120px;min-width:max-content;min-height:100%}
#comment-connector-canvas{position:absolute;left:0;top:0;pointer-events:none;z-index:5;overflow:visible}
#comment-connector-canvas .conn{fill:none;stroke:#cbd5e1;stroke-width:1px;stroke-dasharray:2 2}
#comment-connector-canvas .conn.active{stroke:#2563eb;stroke-width:1.5px;stroke-dasharray:none}
#comment-connector-canvas .dotp{fill:#cbd5e1}
#comment-connector-canvas .dotp.active{fill:#2563eb}
#pages{display:flex;flex-direction:column;gap:24px}
#comment-rail{position:relative;width:240px;flex-shrink:0}

/* 情境工具列（表格／樹枝圖） */
#ctx-bar{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:2px;max-width:560px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:3px;user-select:none}
#ctx-bar[hidden]{display:none}
#ctx-bar button{height:26px;padding:0 8px;border:none;border-radius:5px;background:transparent;font:12px var(--ui-font);color:#334155;cursor:pointer;white-space:nowrap}
#ctx-bar button:hover{background:#e2e8f0}
#ctx-bar button.danger:hover{background:#fee2e2;color:#dc2626}
#ctx-bar .cb-sep{width:1px;background:#e2e8f0;margin:3px 2px}

/* ---------- A4 紙張（Word 標準邊界：上下 2.54 cm、左右 3.17 cm） ---------- */
.a4-page{position:relative;width:210mm;min-height:297mm;padding:2.54cm 3.17cm;background:#ffffff;border:1px solid #e5e7eb;box-shadow:0 4px 12px rgba(0,0,0,.08);display:flex;flex-direction:column;cursor:text}
.page-body{flex:1;outline:none;font-family:var(--font-pming);font-size:12pt;line-height:1.5;color:#000;text-align:justify;text-justify:inter-character;overflow-wrap:anywhere;caret-color:#111}
.page-body p{margin:0 0 .45em}
.page-body h1{font-size:20pt;line-height:1.35;margin:.5em 0 .45em;font-weight:bold}
.page-body h2{font-size:16pt;line-height:1.4;margin:.8em 0 .4em;font-weight:bold}
.page-body h3{font-size:14pt;line-height:1.45;margin:.7em 0 .35em;font-weight:bold}
.page-body > :first-child{margin-top:0}
.page-break{height:0;border-top:2px dashed #94a3b8;margin:22px 0 6px;position:relative;user-select:none;cursor:pointer}
.page-break::before{content:"";position:absolute;left:0;right:0;top:-8px;height:14px}
.page-break:hover{border-top-color:#ef4444}
.page-break:hover::after{content:"分頁符（點擊移除）";color:#ef4444}
.page-break::after{content:"分頁符";position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:#fff;padding:0 10px;font:11px var(--ui-font);color:#94a3b8;letter-spacing:.1em}
.page-number{position:absolute;left:0;right:0;bottom:1.2cm;text-align:center;font:10pt var(--font-pming);color:#94a3b8;user-select:none;pointer-events:none}

/* 文字標記 */
span.hl{background-color:#fef08a;padding:2px 4px;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.comment-target{background:#ffedd5;color:inherit;border-bottom:1px solid #fdba74;border-radius:2px;padding:0 1px;transition:background .15s}
mark.comment-target.active{background:#fed7aa;border-bottom-color:#2563eb}
.comment-point{display:inline-block;width:0;height:1.05em;border-left:2px solid #fb923c;margin:0 1px;vertical-align:text-bottom;cursor:pointer}
.comment-point.active{border-left-color:#2563eb}

/* 引文：無框，左右各縮排一個 12 號字 */
.page-body .quote{margin-left:12pt;margin-right:12pt;font-family:var(--font-kai);font-size:11pt}
.page-body blockquote.quote-block{border:none;margin:.5em 12pt;padding:0;background:none;outline:none}
.quote-text{font-family:var(--font-kai);font-size:11pt;outline:none}
.quote-text p,.quote-text div{margin:0}
.quote-source{margin-top:4px;text-align:right;font-family:var(--font-pming);font-size:9pt;color:#64748b}
.qs-label{user-select:none}
.quote-src-text{display:inline-block;min-width:6em;text-align:left;outline:none}

/* 卡片徽章 */
.card-badge{background-color:#f1f5f9;color:#475569;border:1px solid #cbd5e1;font-size:8pt;border-radius:4px;padding:1px 5px;margin-left:4px;display:inline-flex;align-items:center;cursor:pointer;user-select:none;line-height:1.3;font-family:"Times New Roman",var(--font-pming);vertical-align:baseline;white-space:nowrap;text-indent:0}
.card-badge:hover{background:#e2e8f0;border-color:#94a3b8}
.card-badge.broken{text-decoration:line-through;color:#94a3b8}

/* 表格（預設 10 號字） */
.page-body table.doc-table{width:100%;border-collapse:collapse;table-layout:fixed;margin:.6em 0;font-size:10pt;line-height:1.3}
.doc-table td,.doc-table th{border:1px solid #000;padding:3px 5px;vertical-align:top;overflow-wrap:anywhere}
.doc-table td p,.doc-table th p{margin:0}
.doc-table td.cell-sel,.doc-table th.cell-sel{background:#cfe0fc !important}
table.doc-table.col-resize,table.doc-table.col-resize td,table.doc-table.col-resize th{cursor:col-resize}

/* 樹枝圖（預設 8 號字） */
.tree-diagram{position:relative;margin:.8em 0;min-height:30px;line-height:1.35;cursor:default;background:#fff;font-size:8pt;text-align:center;overflow:visible}
.tree-diagram:focus-within{outline:1px dashed #cbd5e1;outline-offset:5px}
.tree-diagram .td-node,.tree-diagram .td-children{position:static}
.td-box{position:absolute;left:0;top:0;border:1px solid #000;background:#fff;color:#000;padding:3px 6px;text-align:center;outline:none;cursor:text;overflow-wrap:anywhere;white-space:normal}
.td-box:focus{box-shadow:0 0 0 2px rgba(37,99,235,.28)}
.td-note{position:absolute;left:0;top:0;font-size:var(--td-note-size,6pt);line-height:1.3;text-align:left;color:#000;padding:1px 2px;outline:none;cursor:text;overflow-wrap:anywhere;white-space:normal}
.td-note:focus{outline:1px dashed #94a3b8}
.td-lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.td-lines path{fill:none;stroke:#000;stroke-width:1}

/* 腳註（Word 式上標數字） */
sup.fn-ref{line-height:0;user-select:all;font-size:.62em;vertical-align:super;margin:0 1px 0 0}
sup.fn-ref a{color:inherit;text-decoration:none;font-family:"Times New Roman",serif;cursor:pointer}
sup.fn-ref a:hover{color:#2563eb}
.page-footer-footnotes{display:none;margin-top:16px;padding-top:6px;font-size:10pt;line-height:1.4;cursor:default;text-align:justify}
.page-footer-footnotes.has-notes{display:block}
.page-footer-footnotes::before{content:"";display:block;width:33%;border-top:1px solid #64748b;margin-bottom:6px}
.fn-list{list-style:none;margin:0;padding:0}
.fn-item{display:flex;align-items:baseline;gap:4px;padding:1px 0;border-radius:3px;transition:background .4s}
.fn-num{font-size:.7em;line-height:1;align-self:flex-start;margin-top:.15em;font-family:"Times New Roman",serif;user-select:none;color:#000}
.fn-text{flex:1;outline:none;font-family:var(--font-pming);cursor:text}
.fn-back{color:#94a3b8;text-decoration:none;cursor:pointer;user-select:none}
.fn-back:hover{color:#2563eb}
.flash{background:#dbeafe !important}

/* 旁註卡片：灰色細框，無標題 */
.comment-bubble{position:absolute;left:0;width:100%;background:#fff;border:1px solid #9ca3af;border-radius:4px;font-size:13px;z-index:6;transition:top .15s ease,border-color .15s,box-shadow .15s}
.comment-bubble.active{border-color:#4b5563;box-shadow:0 0 0 2px rgba(75,85,99,.12)}
.cb-del{position:absolute;top:3px;right:3px;width:20px;height:20px;border:none;border-radius:4px;background:transparent;color:#9ca3af;cursor:pointer;font-size:11px;opacity:0;transition:opacity .15s}
.comment-bubble:hover .cb-del{opacity:1}
.cb-del:hover{background:#fee2e2;color:#dc2626}
.cb-body{padding:8px 24px 8px 10px;outline:none;min-height:1.6em;line-height:1.6;font-family:var(--font-pming);color:#1f2937;cursor:text;overflow-wrap:anywhere}

[data-placeholder]:empty::before{content:attr(data-placeholder);color:#cbd5e1;pointer-events:none}

.empty-state{width:210mm;padding:80px 20px;text-align:center;color:#64748b;background:#fff;border:1px dashed #cbd5e1;border-radius:8px}
.empty-state button{margin-top:12px;height:34px;padding:0 16px;border:none;border-radius:8px;background:#2563eb;color:#fff;font:14px var(--ui-font);cursor:pointer}

/* 卡片抽屜 */
#card-drawer{position:fixed;right:0;bottom:0;width:440px;max-width:94vw;background:#fff;border-left:1px solid #e2e8f0;box-shadow:-8px 0 24px rgba(0,0,0,.1);z-index:900;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
#card-drawer.open{transform:translateX(0)}
.cd-head{display:flex;align-items:flex-start;gap:8px;padding:14px 16px 6px}
.cd-no{flex-shrink:0;font:600 13px "Times New Roman",serif;color:#fff;background:#059669;border-radius:5px;padding:3px 7px;margin-top:2px}
.cd-title{flex:1;font:700 17px var(--font-pming);color:#0f172a;outline:none;border-bottom:1px dashed transparent;padding:2px 0}
.cd-title:focus{border-bottom-color:#94a3b8}
.cd-close{border:none;background:transparent;font-size:18px;color:#94a3b8;cursor:pointer;width:28px;height:28px;border-radius:6px}
.cd-close:hover{background:#f1f5f9;color:#0f172a}
.cd-path{padding:0 16px 8px;font-size:12px;color:#64748b}
.cd-scroll{flex:1;overflow:auto;padding:0 16px 24px}
.cd-body{min-height:140px;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;outline:none;font-family:var(--font-pming);font-size:12pt;line-height:1.6;text-align:justify;color:#000}
.cd-body:focus{border-color:#93c5fd}
.cd-body p{margin:0 0 .4em}
.cd-sec{margin-top:16px}
.cd-sec-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:#475569;margin-bottom:6px}
.cd-sec-h button{height:24px;padding:0 8px;border:1px solid #e2e8f0;background:#fff;border-radius:6px;font:12px var(--ui-font);cursor:pointer;color:#334155}
.cd-sec-h button:hover{background:#eef2ff}
.cd-list{list-style:none;margin:0;padding:0}
.cd-list li{padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer;color:#334155;line-height:1.45}
.cd-list li:hover{background:#f1f5f9}
.cd-list .ctx{display:block;color:#64748b;font-size:12px;margin-top:2px}
.cd-list .empty{color:#94a3b8;cursor:default}
.cd-list .empty:hover{background:none}

/* 對話框 */
#dlg-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:3000;display:flex;align-items:center;justify-content:center}
.dlg{background:#fff;border-radius:12px;width:min(540px,92vw);max-height:84vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg-h{padding:14px 18px;font-weight:700;font-size:15px;border-bottom:1px solid #f1f5f9}
.dlg-b{padding:14px 18px;overflow:auto;font-size:13.5px;line-height:1.65;color:#334155}
.dlg-f{padding:12px 18px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;gap:8px}
.dbtn{height:32px;padding:0 14px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font:13px var(--ui-font);cursor:pointer;color:#334155}
.dbtn:hover{background:#f1f5f9}
.dbtn.primary{background:#2563eb;border-color:#2563eb;color:#fff}
.dbtn.primary:hover{background:#1d4ed8}
.dlg label.fl{display:block;font-size:12px;font-weight:600;color:#475569;margin:8px 0 4px}
.dlg input[type=text]{width:100%;height:32px;border:1px solid #cbd5e1;border-radius:7px;padding:0 10px;font:13.5px var(--ui-font)}
.dlg input[type=text]:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.dlg select{height:28px;border:1px solid #cbd5e1;border-radius:6px;font:12.5px var(--ui-font);max-width:200px}
.seg{display:flex;gap:4px;margin:12px 0 8px}
.seg button{flex:1;height:32px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;cursor:pointer;font:13px var(--ui-font)}
.seg button.on{background:#e0e7ff;border-color:#a5b4fc;color:#3730a3;font-weight:600}
.pick-list{border:1px solid #e2e8f0;border-radius:8px;max-height:260px;overflow:auto;margin-top:6px}
.pick-item{padding:6px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #f8fafc}
.pick-item:hover{background:#f1f5f9}
.pick-item.on{background:#dbeafe}
.pick-item.dis{color:#cbd5e1;cursor:not-allowed}
.pick-item .no{color:#64748b;font-family:"Times New Roman",serif;margin-right:6px}
.opt{display:block;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:has(input:checked){border-color:#93c5fd;background:#f8fbff}
.assign-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed #f1f5f9}

/* 圖譜 */
#graph-overlay{position:fixed;inset:0;z-index:2500;background:#fbfcfd;display:flex;flex-direction:column}
#graph-overlay[hidden]{display:none}
.gv-head{display:flex;align-items:center;gap:14px;padding:9px 16px;color:#334155;font-size:13px;background:#fff;border-bottom:1px solid #e2e8f0;flex-wrap:wrap;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.gv-head b{font-size:15px;color:#0f172a}
.gv-modes{display:inline-flex;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden}
.gv-modes button{height:30px;padding:0 14px;border:none;background:#fff;color:#475569;cursor:pointer;font:13px var(--ui-font)}
.gv-modes button+button{border-left:1px solid #cbd5e1}
.gv-modes button.on{background:#1e3a8a;color:#fff}
.gv-legend span{margin-right:12px;white-space:nowrap}
.gv-hint{color:#64748b;font-size:12px}
.gv-opt{display:inline-flex;align-items:center;gap:5px;color:#475569;font-size:12.5px;cursor:pointer;user-select:none}
#gv-close{margin-left:auto;height:30px;padding:0 14px;border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:7px;cursor:pointer;font:13px var(--ui-font)}
#gv-close:hover{background:#f1f5f9}
#graph-canvas{flex:1;display:block;width:100%;cursor:grab;min-height:0}
#graph-canvas[hidden],#gv-tree[hidden],.gv-only-net[hidden],.gv-only-tree[hidden]{display:none}
/* 階層樹狀視圖 */
#gv-tree{flex:1;overflow:auto;padding:26px 30px 60px;min-height:0;background:#fbfcfd;font-size:13px;color:#1e293b}
.mt-root{display:flex;flex-direction:column;gap:18px;width:max-content}
.mt-node{display:flex;align-items:flex-start}
.mt-kids{position:relative;padding-left:22px;display:flex;flex-direction:column}
.mt-kids::before{content:"";position:absolute;left:0;top:17px;width:22px;border-top:1.5px solid #cbd5e1}
.mt-kids>.mt-node{position:relative;padding-left:20px;padding-bottom:10px}
.mt-kids>.mt-node:last-child{padding-bottom:0}
.mt-kids>.mt-node::before{content:"";position:absolute;left:0;top:17px;width:20px;border-top:1.5px solid #cbd5e1}
.mt-kids>.mt-node::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid #cbd5e1}
.mt-kids>.mt-node:first-child::after{top:17px}
.mt-kids>.mt-node:last-child::after{bottom:auto;height:17px}
.mt-kids>.mt-node:only-child::after{display:none}
.mt-self{flex-shrink:0;min-width:140px;max-width:240px;background:#fff;border:1px solid #d6dde6;border-radius:8px;padding:6px 10px;cursor:pointer;transition:opacity .15s,box-shadow .15s,border-color .15s}
.mt-self:hover{border-color:#94a3b8;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.mt-self.folder{background:#eff4ff;border-color:#bfd0f5}
.mt-self.card{border-left:3px solid #10b981}
.mt-h{display:flex;align-items:baseline;gap:6px;line-height:1.45}
.mt-no{flex-shrink:0;font:600 11px var(--ui-font);color:#fff;background:#64748b;border-radius:4px;padding:0 5px}
.mt-self.folder .mt-no{background:#3b5bdb}
.mt-self.card .mt-no{background:#059669}
.mt-t{font-weight:600;word-break:break-word}
.mt-open{margin-left:auto;flex-shrink:0;border:none;background:none;color:#94a3b8;cursor:pointer;font-size:12px;padding:0 0 0 6px}
.mt-open:hover{color:#1e3a8a}
.mt-cnt{margin-left:auto;color:#94a3b8;font-size:11px;flex-shrink:0}
.mt-body{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed #e2e8f0;font:13px/1.65 var(--font-pming),serif;color:#1e293b;cursor:text}
.mt-body p{margin:0 0 .35em}
.mt-body:empty::before{content:"（尚無內容）";color:#cbd5e1}
.mt-refs{display:none;margin-top:6px;padding-top:5px;border-top:1px solid #f1f5f9;font-size:11.5px;color:#64748b}
.mt-refs .r{display:block;padding:1px 0;cursor:pointer;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-refs .r:hover{color:#1d4ed8;text-decoration:underline}
.mt-refs .r .c{color:#94a3b8}
.mt-refs .none{color:#cbd5e1}
#gv-tree.show-all .mt-self.card,#gv-tree .mt-self.lit.card{max-width:340px;min-width:260px}
#gv-tree.show-all .mt-self.card .mt-body,#gv-tree.show-all .mt-self.card .mt-refs,#gv-tree .mt-self.lit .mt-body,#gv-tree .mt-self.lit .mt-refs{display:block}
#gv-tree.has-sel .mt-self{opacity:.38}
#gv-tree.has-sel .mt-self.lit,#gv-tree.has-sel .mt-self.anc{opacity:1}
#gv-tree .mt-self.anc{border-style:dashed}
#gv-tree .mt-self.lit{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.18)}
#gv-tree .mt-self.sel{border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.28);background:#f8fbff}
#gv-tree.has-sel .mt-node.lit-line>.mt-kids::before,#gv-tree.has-sel .mt-node.lit-line>.mt-kids>.mt-node::before,#gv-tree.has-sel .mt-node.lit-line>.mt-kids>.mt-node::after{border-color:#3b82f6}
.mt-empty{color:#94a3b8;padding:30px}

/* ===== 文章大綱導覽窗格 ===== */
#nav-pane{width:236px;flex-shrink:0;display:flex;flex-direction:column;background:#fbfbfc;border-right:1px solid var(--line);min-height:0}
#nav-pane[hidden]{display:none}
.np-head{display:flex;align-items:center;gap:4px;padding:9px 8px 8px 12px;border-bottom:1px solid var(--line);font-size:13px;color:#334155}
.np-head b{flex:1;font-size:13px}
.np-head button{border:none;background:none;color:#64748b;cursor:pointer;font-size:12px;padding:3px 5px;border-radius:5px}
.np-head button:hover{background:#eef2f7;color:#0f172a}
#np-list{flex:1;overflow:auto;padding:6px 4px 30px;margin:0;list-style:none;font-size:13px}
#np-list li{list-style:none}
.np-row{display:flex;align-items:flex-start;gap:2px;padding:3px 6px 3px 0;border-radius:6px;cursor:pointer;color:#334155;line-height:1.45;border-left:3px solid transparent}
.np-row:hover{background:#eef2f7}
.np-row.active{background:#e0eaff;color:#1e3a8a;border-left-color:#3b5bdb;font-weight:600}
.np-tg{flex-shrink:0;width:16px;text-align:center;color:#94a3b8;font-size:10px;line-height:19px}
.np-tg:hover{color:#0f172a}
.np-t{flex:1;word-break:break-word}
.np-n{color:#64748b;margin-right:1px}
.np-row.active .np-n{color:#3b5bdb}
.np-row.lv1 .np-t{font-weight:600}
#np-list ul{margin:0;padding:0}
#np-list li.closed>ul{display:none}
.np-empty{color:#94a3b8;font-size:12.5px;padding:14px 12px;line-height:1.6}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:all .2s;z-index:4000;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 超連結：一律灰藍色，點過也不變色 */
a.doc-link,a.doc-link:link,a.doc-link:visited,a.doc-link:hover,a.doc-link:active{color:#4A6A8A;text-decoration:underline;text-decoration-color:rgba(74,106,138,.5);text-underline-offset:2px;cursor:text}
a.doc-link:hover{text-decoration-color:#4A6A8A}

/* 圖片 */
.img-wrap{display:inline-block;position:relative;max-width:100%;vertical-align:bottom;line-height:0;user-select:none;cursor:default}
.img-wrap img{display:block;max-width:100%;height:auto}
.img-wrap.sel{outline:2px solid #3b82f6;outline-offset:1px}
.img-handle{position:absolute;right:-6px;bottom:-6px;width:11px;height:11px;background:#3b82f6;border:1.5px solid #fff;border-radius:2px;cursor:nwse-resize;display:none}
.img-wrap.sel .img-handle{display:block}

/* 樹枝圖：方框內換行、縮放把手、全選 */
.td-box p,.td-box div{margin:0}
.td-box.rz-e{cursor:ew-resize}
.td-box.rz-s{cursor:ns-resize}
.td-box.rz-se{cursor:nwse-resize}
.tree-diagram.td-allsel{outline:2px solid #93c5fd;outline-offset:5px}
.tree-diagram.td-allsel .td-box{background:#dbeafe}
.tree-diagram.td-allsel .td-note{background:#eff6ff}

/* 卡片抽屜：路徑導航與內容串聯 */
.cd-path .crumb{color:#2563eb;cursor:pointer}
.cd-path .crumb:hover{text-decoration:underline}
.cd-path .sep{color:#cbd5e1;margin:0 6px}
.cd-path .cur{color:#334155;font-weight:600}
.cd-back{border:1px solid #e2e8f0;background:#fff;border-radius:6px;height:26px;padding:0 8px;font:12px var(--ui-font);color:#334155;cursor:pointer;flex-shrink:0;margin-top:1px}
.cd-back:hover{background:#f1f5f9}
.chain-item{border-left:2px solid #a7f3d0;padding:4px 0 6px 10px;margin:10px 0}
.chain-h{font:600 13px var(--ui-font);color:#065f46;cursor:pointer;margin-bottom:3px}
.chain-h:hover{text-decoration:underline}
.chain-c{font-family:var(--font-pming);font-size:11pt;line-height:1.6;color:#111;text-align:justify}
.chain-c p{margin:0 0 .3em}
.chain-c:empty::before{content:"（尚無內容）";color:#cbd5e1}
.cd-list .chap{color:#2563eb;font-size:12px;margin-left:4px}

/* ===== 顯示模式 ===== */
html.theme-dark{filter:invert(.9) hue-rotate(180deg);background:#fff}
html.theme-dark img,html.theme-dark #graph-overlay,html.theme-dark .sw,html.theme-dark .hl-swatch,html.theme-dark span.hl{filter:invert(1) hue-rotate(180deg)}
html.theme-sepia #workspace,html.theme-sepia #ref-pane .ref-body{background:#e7dfcc}
html.theme-sepia .a4-page,html.theme-sepia .tree-diagram,html.theme-sepia .td-box,html.theme-sepia .fold{background:#f8f1e1}
html.theme-sepia .a4-page{border-color:#e2d6bb}
html.theme-sepia .page-break::after{background:#f8f1e1}


/* ===== 第四層以下標題與自動編號 ===== */
.page-body h4{font-size:13pt;line-height:1.45;margin:.6em 0 .3em;font-weight:bold}
.page-body h5,.page-body h6{font-size:12pt;line-height:1.5;margin:.5em 0 .3em;font-weight:bold}
.ol-num{user-select:none}

/* ===== 書籤 ===== */
.page-body [data-bm]{position:relative}
.page-body [data-bm]::before{content:"🔖";position:absolute;left:-28px;top:.15em;font-size:12px;line-height:1;font-weight:normal}
.bm-group{padding:10px 10px 2px;font-size:12px;font-weight:700;color:#64748b}
.bm-item{display:flex;align-items:center;gap:6px;padding:6px 10px;margin:0 4px;border-radius:6px;font-size:13px;color:#334155;cursor:pointer}
.bm-item:hover{background:#eef2f7}
.bm-item .bm-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:none}
.bm-item .bm-name[contenteditable="true"]{background:#fff;box-shadow:0 0 0 1.5px var(--accent);border-radius:2px;white-space:normal}
.bm-item button{border:none;background:transparent;color:#94a3b8;cursor:pointer;display:none;border-radius:4px}
.bm-item:hover button{display:block}
.bm-item button:hover{background:#fee2e2;color:#dc2626}

/* ===== 折疊框 ===== */
.page-body .fold{border:1px solid #cbd5e1;border-radius:6px;margin:.6em 0;background:#fafbfc}
.fold-h{display:flex;align-items:baseline;gap:6px;padding:4px 10px;font-weight:bold}
.fold-tg{user-select:none;color:#475569;font-size:.8em;width:1em;flex-shrink:0;cursor:pointer}
.fold-title{flex:1;outline:none;cursor:text}
.fold-b{padding:2px 12px 8px 28px;border-top:1px dashed #e2e8f0}
.fold-b p{margin:0 0 .35em}
.fold:not(.open) .fold-b{display:none}
.fold:not(.open) .fold-title{cursor:pointer}
.img-del{position:absolute;top:-10px;right:-10px;width:22px;height:22px;border-radius:50%;border:1px solid #fecaca;background:#fff;color:#dc2626;font:12px/20px var(--ui-font);text-align:center;cursor:pointer;display:none;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.img-wrap.sel .img-del{display:block}
.img-del:hover{background:#fee2e2}

/* ===== 公式 ===== */
.math{display:inline-block;cursor:pointer;padding:0 1px;border-radius:3px;text-indent:0}
.math:hover{background:#eef2ff}
.math.display{display:block;text-align:center;margin:.4em 0}
math{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",math;font-size:1.06em}
.tex-preview{min-height:60px;border:1px dashed #cbd5e1;border-radius:8px;padding:12px;text-align:center;margin-top:8px;background:#fcfcfd;font-size:14pt}
.tex-input{width:100%;min-height:80px;font:14px Consolas,"Courier New",monospace;border:1px solid #cbd5e1;border-radius:7px;padding:8px}
.tex-keys{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tex-keys button{height:26px;min-width:30px;padding:0 6px;border:1px solid #e2e8f0;background:#fff;border-radius:5px;cursor:pointer;font:13px "Cambria Math","Times New Roman",serif}
.tex-keys button:hover{background:#eef2ff}

/* ===== 尋找與取代 ===== */
::highlight(find-all){background-color:#fde68a;color:inherit}
::highlight(find-cur){background-color:#fb923c;color:#fff}
#find-bar{position:fixed;right:16px;z-index:1300;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.16);padding:8px;display:flex;flex-direction:column;gap:6px;width:420px;font:13px var(--ui-font)}
#find-bar[hidden]{display:none}
.fb-row{display:flex;gap:4px;align-items:center}
.fb-row input[type=text]{flex:1;height:30px;border:1px solid #cbd5e1;border-radius:6px;padding:0 8px;font:13px var(--ui-font)}
.fb-row input[type=text]:focus{outline:none;border-color:#3b82f6}
.fb-row button{height:30px;padding:0 9px;border:1px solid #e2e8f0;background:#fff;border-radius:6px;cursor:pointer;font:12.5px var(--ui-font);white-space:nowrap}
.fb-row button:hover{background:#f1f5f9}
.fb-row select{height:30px;border:1px solid #e2e8f0;border-radius:6px;font:12px var(--ui-font)}
#fb-count{min-width:54px;text-align:center;color:#64748b;font-size:12px}
#find-bar:not(.with-replace) .fb-replace{display:none}

/* ===== 引用範本選單 ===== */
#cite-menu{position:absolute;top:36px;z-index:1200}
#cite-menu[hidden]{display:none}
.cm,.cm ul{list-style:none;margin:0;padding:4px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:190px}
.cm li{position:relative}
.cm li>span{display:flex;justify-content:space-between;gap:14px;padding:7px 10px;border-radius:5px;font-size:13px;color:#334155;cursor:pointer;white-space:nowrap}
.cm li:hover>span{background:#eef2ff;color:#3730a3}
.cm ul{position:absolute;left:100%;top:-5px;display:none}
.cm li:hover>ul{display:block}
.cite-preview{margin-top:10px;padding:8px 10px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:7px;font-family:var(--font-pming);font-size:12pt;color:#111;min-height:2em}

/* ===== 便條紙 ===== */
#sticky-layer{position:fixed;inset:0;pointer-events:none;z-index:1500}
.sticky{position:absolute;pointer-events:auto;width:250px;height:210px;min-width:170px;min-height:120px;background:#fff8c5;border:1px solid #ecd47a;border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;resize:both;overflow:hidden}
.st-head{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 8px;background:#fde68a;cursor:move;font:600 12.5px var(--ui-font);color:#713f12;user-select:none}
.st-date,.st-title{outline:none;cursor:text;min-width:1.5em;user-select:text;white-space:nowrap;overflow:hidden}
.st-date{font-family:"Times New Roman",serif}
.st-title{flex:1}
.st-head button{border:none;background:transparent;cursor:pointer;color:#92400e;width:22px;height:22px;border-radius:4px;flex-shrink:0}
.st-head button:hover{background:rgba(146,64,14,.12)}
.st-body{flex:1;overflow:auto;padding:8px 10px;outline:none;font:13px/1.6 var(--ui-font);color:#1f2937;white-space:pre-wrap}
.tray-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed #f1f5f9}
.tray-row span{flex:1}
#tray-count{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:#e2e8f0;font-size:11px;text-align:center}

/* ===== 雙欄對照 ===== */
#ref-pane{width:44%;min-width:260px;flex-shrink:0;display:flex;flex-direction:column;background:#eceff3;border-right:1px solid #d6dbe1}
#ref-pane[hidden],#ref-divider[hidden]{display:none}
.ref-head{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.ref-head select{flex:1;min-width:0;height:30px;border:1px solid #cbd5e1;border-radius:6px;font:13px var(--ui-font);background:#fff}
.ref-head button{height:30px;padding:0 9px;border:1px solid #e2e8f0;background:#fff;border-radius:6px;cursor:pointer;font:12.5px var(--ui-font)}
.ref-body{flex:1;overflow:auto;padding:16px}
.ref-zoom .a4-page{margin-bottom:16px;cursor:default}
.ref-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:18px 22px;font-family:var(--font-pming);font-size:12pt;line-height:1.7;text-align:justify}
.ref-card h2{font-size:15pt;margin:0 0 10px}
#ref-divider{width:6px;flex-shrink:0;cursor:col-resize;background:#e2e8f0}
#ref-divider:hover{background:#93c5fd}

/* ===== 字數統計 ===== */
.wc-grid{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:14px;margin:6px 0 12px}
.wc-grid b{font-family:"Times New Roman",serif;font-size:15px;text-align:right}
.wc-grid .tot{border-top:1px solid #e2e8f0;padding-top:6px;font-weight:700}

/* 區塊快速刪除 */
#block-handle{position:absolute;z-index:19;display:flex;gap:2px;background:#fff;border:1px solid #e2e8f0;border-radius:7px;box-shadow:0 4px 12px rgba(0,0,0,.12);padding:2px;user-select:none}
#block-handle[hidden]{display:none}
#block-handle button{height:24px;padding:0 8px;border:none;border-radius:5px;background:transparent;font:12px var(--ui-font);color:#334155;cursor:pointer;white-space:nowrap}
#block-handle button:hover{background:#e2e8f0}
#block-handle button.danger{color:#b91c1c}
#block-handle button.danger:hover{background:#fee2e2}
.del-pending{outline:2px solid #ef4444 !important;outline-offset:3px;background-color:rgba(239,68,68,.06) !important}
#undo-bar{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:4001;display:flex;align-items:center;gap:14px;background:#1e293b;color:#fff;font:13px var(--ui-font);padding:8px 10px 8px 16px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#undo-bar[hidden]{display:none}
#undo-bar button{height:28px;padding:0 12px;border:none;border-radius:6px;background:#3b82f6;color:#fff;font:13px var(--ui-font);cursor:pointer}

@media print{

function rgbToHex(c) {
  const m = String(c).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!m) return '000000';
  return [m[1], m[2], m[3]].map(v => (+v).toString(16).padStart(2, '0')).join('').toUpperCase();

function fontMap() { return (data && data.ui && data.ui.fontMap) || {}; }
function fontStack(k, override) {
  const m = override !== undefined ? override : fontMap()[k];
  const list = [...(m ? [m] : []), ...FONT_DEFS[k].names, ...FONT_DEFS[k].fallback];
  return '"Times New Roman", Times, ' + list.map(n => '"' + n.replace(/"/g, '') + '"').join(', ') + ', serif';
}
function applyFontVars() {
  Object.keys(FONT_DEFS).forEach(k => document.documentElement.style.setProperty('--font-' + k, fontStack(k)));
}
function wordFontName(k) { return fontMap()[k] || FONT_DEFS[k].word; }
function fontKeyFromFamily(ff) {
  ff = String(ff || '');
  const v = /var\(--font-(\w+)\)/.exec(ff);
  if (v && FONT_DEFS[v[1]]) return v[1];
  const names = ff.split(',').map(s => s.trim().replace(/^["']|["']$/g, '')).filter(n => n && !/^(Times New Roman|Times|serif|sans-serif|monospace)$/i.test(n));
  const map = fontMap();
  for (const n of names) {
    for (const k of Object.keys(FONT_DEFS)) if (map[k] && map[k] === n) return k;
    for (const k of Object.keys(FONT_DEFS)) if (FONT_DEFS[k].names.includes(n)) return k;
  }
  const first = names[0] || '';
  if (/DFKai|標楷|BiauKai|Kaiti|KaiTi|STKaiti|TW-Kai|MOE-Std-Kai|楷/i.test(first)) return 'kai';
  if (/SimSun|宋|Songti|STSong/i.test(first)) return 'song';
  if (/^PMingLiU|新細明體/i.test(first)) return 'pming';
  if (/MingLiU|細明體|LiSung|LiSong/i.test(first)) return 'ming';
  return 'pming';
}
function migrateFonts(root) {
  if (!root) return;
  root.querySelectorAll('[style*="font-family"]').forEach(el => {
    const ff = el.style.fontFamily;
    if (!ff || /^var\(/.test(ff) || !/Times New Roman/.test(ff)) return;
    el.style.fontFamily = 'var(--font-' + fontKeyFromFamily(ff) + ')';
  });
}
function safeFileName(s) { return String(s || '筆記').replace(/[\\/:*?"<>|]+/g, '_').trim() || '筆記'; }

const fontCache = {};
function fontInstalled(name) {
  if (!name) return false;
  if (name in fontCache) return fontCache[name];
  let ok = true;
  try {
    const c = document.createElement('canvas'); c.width = 120; c.height = 40;
    const x = c.getContext('2d');
    const draw = f => { x.clearRect(0, 0, 120, 40); x.font = '30px ' + f; x.fillStyle = '#000'; x.fillText('永楷體W', 0, 32); return x.getImageData(0, 0, 120, 40).data.join(''); };
    const q = '"' + name.replace(/"/g, '') + '"';
    ok = ['serif', 'sans-serif', 'monospace'].some(g => draw(q + ', ' + g) !== draw(g));
  } catch (_) { ok = true; }
  fontCache[name] = ok;
  return ok;
}
const fontFound = {};
function detectFont(k, override) {
  const m = override !== undefined ? override : fontMap()[k];
  if (m) return fontInstalled(m) ? m : '';
  return FONT_DEFS[k].names.find(fontInstalled) || '';
}
function checkFonts() {
  Object.keys(FONT_DEFS).forEach(k => { fontFound[k] = detectFont(k); fontAvail[k] = !!fontFound[k]; });
  [...$('#sel-font').options].forEach(o => {
    o.textContent = FONT_DEFS[o.value].label + (fontAvail[o.value] ? '' : '（未偵測到）');
  });
}
function warnFont(key) {
  if (fontAvail[key] === false) {
    toast('未偵測到「' + FONT_DEFS[key].label + '」：可能是字型名稱或版本不同。請按字體選單旁的 ⚙ 指定本機實際安裝的字型。', 6000);
  }
}

function ensureShape(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.tree)) return defaultData();
  d.version = 3;
  d.notes = (d.notes && typeof d.notes === 'object') ? d.notes : {};
  d.ui = d.ui || {};
  if (!d.ui.sideTab) d.ui.sideTab = 'notes';
  if (!d.slipbox || !Array.isArray(d.slipbox.tree)) d.slipbox = { tree: [] };
  if (!Array.isArray(d.stickies)) d.stickies = [];
  if (!Array.isArray(d.trash)) d.trash = [];
  if (!d.ui.view) d.ui.view = { theme: 'white' };
  const fix = nodes => nodes.forEach(n => {
    if (!n.id) n.id = uid(n.type === 'folder' ? 'folder' : 'note');
    if (!n.name) n.name = '未命名';
    if (n.type === 'folder') {
      if (!Array.isArray(n.children)) n.children = [];
      fix(n.children);
    } else {
      n.type = 'note';
      delete n.children;
      if (!d.notes[n.id]) d.notes[n.id] = { html: pageHTML(), comments: {} };
      if (!d.notes[n.id].comments) d.notes[n.id].comments = {};
    }
  });
  fix(d.tree);
  const fixC = nodes => nodes.forEach(n => {
    if (!n.id) n.id = uid(n.type === 'card' ? 'card' : 'cf');
    if (!Array.isArray(n.children)) n.children = [];
    if (n.type === 'card') { if (typeof n.title !== 'string') n.title = '未命名卡片'; if (typeof n.html !== 'string') n.html = ''; }
    else { n.type = 'cfolder'; if (!n.name) n.name = '未命名資料夾'; }
    fixC(n.children);
  });
  fixC(d.slipbox.tree);
  migrateExample(d);
  return d;
}

/* ---------- 樹狀資料通用操作 ---------- */
function rootOf(kind) { return kind === 'cards' ? data.slipbox.tree : data.tree; }
function findIn(root, id, parent = null) {
  for (let i = 0; i < root.length; i++) {
    const n = root[i];
    if (n.id === id) return { node: n, list: root, index: i, parent };
    if (n.children && n.children.length) { const r = findIn(n.children, id, n); if (r) return r; }
  }
  return null;
}
const findNode = id => findIn(data.tree, id);
const findCard = id => findIn(data.slipbox.tree, id);
function isDescendant(node, target) {
  if (!node.children) return false;
  for (const c of node.children) { if (c === target || isDescendant(c, target)) return true; }
  return false;
}
function firstNoteId(nodes = data.tree) {
  for (const n of nodes) {
    if (n.type === 'note') return n.id;
    if (n.type === 'folder') { const r = firstNoteId(n.children); if (r) return r; }
  }
  return null;
}
function collectIds(node, out = []) {
  out.push(node.id);
  (node.children || []).forEach(c => collectIds(c, out));
  return out;
}
function collectNoteIds(node) { return collectIds(node).filter(id => data.notes[id]); }
function nodeName(n) { return n.type === 'card' ? n.title : n.name; }
function setNodeName(n, v) { if (n.type === 'card') n.title = v; else n.name = v; }

/* ---------- 卡片盒編號（Folgezettel） ---------- */
function computeCardNos() {
  const map = new Map();
  const walkC = (cards, prefix) => cards.forEach((c, i) => { const no = prefix + '.' + (i + 1); map.set(c.id, no); walkC(c.children, no); });
  const walkF = (nodes, prefix) => {
    let fi = 0, ci = 0;
    nodes.forEach(n => {
      if (n.type === 'cfolder') {
        let no;
        if (!prefix && n.zero) no = '0';
        else { fi++; no = prefix ? prefix + '.' + fi : String(fi); }
        map.set(n.id, no);
        walkF(n.children, no);
      } else {
        ci++;
        const no = (prefix || '0') + '.' + ci;
        map.set(n.id, no);
        walkC(n.children, no);
      }
    });
  };
  walkF(data.slipbox.tree, '');
  cardNos = map;
  return map;
}
const folderLabel = no => (no && no.indexOf('.') < 0 ? no + '.' : no);
const badgeText = (no, title) => '[' + no + ' ' + title + ']';
function cardLabel(n) {
  const no = cardNos.get(n.id) || '';
  return (n.type === 'cfolder' ? folderLabel(no) : no) + ' ' + nodeName(n);
}
function cardPath(id) {
  const out = [];
  const walk = (nodes, trail) => {
    for (const n of nodes) {
      if (n.id === id) { out.push(...trail); return true; }
      if (walk(n.children, trail.concat(n))) return true;
    }
    return false;
  };
  walk(data.slipbox.tree, []);
  return out;
}
function allCards() {
  const out = [];
  const walk = nodes => nodes.forEach(n => { if (n.type === 'card') out.push(n); walk(n.children); });
  walk(data.slipbox.tree);
  return out;
}

function sideKind() { return data.ui.sideTab === 'cards' ? 'cards' : data.ui.sideTab === 'bookmarks' ? 'bookmarks' : 'notes'; }

function renderTree() {
  const kind = sideKind();
  document.querySelectorAll('.sb-tab').forEach(t => t.classList.toggle('on', t.dataset.tab === kind));
  $('#sb-title').textContent = kind === 'cards' ? '卡片盒' : kind === 'bookmarks' ? '章節書籤' : '筆記庫';
  $('#btn-new-doc').textContent = kind === 'cards' ? '＋ 卡片' : kind === 'bookmarks' ? '＋ 加入書籤' : '＋ 筆記';
  $('#btn-new-folder').hidden = kind === 'bookmarks';
  if (kind === 'bookmarks') { treeEl.dataset.kind = kind; renderBookmarks(); return; }
  treeEl.innerHTML = '';
  treeEl.dataset.kind = kind;
  const root = rootOf(kind);
  if (kind === 'cards') computeCardNos();
  if (!root.length) {
    const li = document.createElement('li');
    li.className = 'tree-empty';
    li.textContent = kind === 'cards'
      ? '卡片盒尚無內容。請先按「＋ 資料夾」建立頂層分類（如：法律），卡片須放在資料夾內。'
      : '目前沒有任何資料夾或筆記，請點選上方「＋ 資料夾」或「＋ 筆記」開始建立。';
    treeEl.appendChild(li);
    treeEl.appendChild(dropLine);
    return;
  }
  const build = (nodes, depth, container) => {
    nodes.forEach(n => {
      const li = document.createElement('li');
      const row = document.createElement('div');
      row.className = 'tree-row ' + n.type;
      row.dataset.id = n.id;
      row.draggable = true;
      row.style.paddingLeft = (6 + depth * 14) + 'px';
      const hasKids = n.children && n.children.length;
      if (kind === 'notes') {
        if (n.id === data.activeId) row.classList.add('active');
        if (n.id === selectedFolderId) row.classList.add('selected');
      } else {
        if (n.id === drawerCardId) row.classList.add('active');
        if (n.id === selectedCFolderId) row.classList.add('selected');
      }
      let acts = '', icon, label;
      if (kind === 'notes') {
        icon = n.type === 'folder' ? ICON_FOLDER : ICON_NOTE;
        label = '<span class="nm"></span>';
        acts = n.type === 'folder'
          ? '<button data-act="add-doc" title="在此資料夾下建立子文件">+📄</button><button data-act="add-folder" title="在此資料夾下建立子資料夾">+📁</button><button data-act="more" title="更多操作">⋯</button>'
          : '<button data-act="more" title="更多操作">⋯</button>';
      } else {
        icon = n.type === 'cfolder' ? ICON_CFOLDER : ICON_CARD;
        const no = cardNos.get(n.id) || '';
        label = '<span class="no">' + hesc(n.type === 'cfolder' ? folderLabel(no) : no) + '</span><span class="nm"></span>';
        acts = n.type === 'cfolder'
          ? '<button data-act="add-doc" title="在此資料夾下建立卡片">+📄</button><button data-act="add-folder" title="在此資料夾下建立子資料夾">+📁</button><button data-act="more" title="更多操作">⋯</button>'
          : '<button data-act="add-doc" title="建立下層卡片">+📄</button><button data-act="more" title="更多操作">⋯</button>';
      }
      const twisty = (n.type === 'folder' || n.type === 'cfolder' || hasKids) ? (n.open ? '▾' : '▸') : '';
      row.innerHTML = '<span class="tw">' + twisty + '</span><span class="ti">' + icon + '</span><span class="tn">' + label + '</span><span class="ta">' + acts + '</span>';
      row.querySelector('.nm').textContent = nodeName(n);
      row.title = kind === 'cards' ? cardLabel(n) : nodeName(n);
      li.appendChild(row);
      container.appendChild(li);
      if (hasKids && n.open) {
        const ul = document.createElement('ul');
        li.appendChild(ul);
        build(n.children, depth + 1, ul);
      }
    });
  };
  build(root, 0, treeEl);
  treeEl.appendChild(dropLine);
}

document.querySelectorAll('.sb-tab').forEach(t => t.addEventListener('click', () => {
  data.ui.sideTab = t.dataset.tab;
  renderTree();
}));

treeEl.addEventListener('click', e => {
  const row = e.target.closest('.tree-row');
  const kind = sideKind();
  if (kind === 'bookmarks') return;
  if (!row) {
    if (kind === 'notes') selectedFolderId = null; else selectedCFolderId = null;
    renderTree();
    return;
  }
  if (row.querySelector('.nm[contenteditable="true"]')) return;
  const found = findIn(rootOf(kind), row.dataset.id);
  if (!found) return;
  const node = found.node;
  const actBtn = e.target.closest('[data-act]');
  if (actBtn) { e.stopPropagation(); treeAction(kind, actBtn.dataset.act, node, actBtn); return; }
  if (e.target.closest('.tw') && node.children && node.children.length && node.type === 'card') {
    node.open = !node.open; renderTree(); return;
  }
  if (kind === 'notes') {
    if (node.type === 'folder') { node.open = !node.open; selectedFolderId = node.id; renderTree(); }
    else switchNote(node.id);
  } else {
    if (node.type === 'cfolder') { node.open = !node.open; selectedCFolderId = node.id; renderTree(); }
    else openCard(node.id);
  }
});
treeEl.addEventListener('dblclick', e => {
  const nm = e.target.closest('.tn');
  if (nm) { e.preventDefault(); startRename(sideKind(), nm.closest('.tree-row').dataset.id); }
});

function treeAction(kind, act, node, btn) {
  if (act === 'add-doc') {
    if (kind === 'notes') { node.open = true; createNote(node); }
    else { const c = createCard(node); if (c) { openCard(c.id); setTimeout(() => startRename('cards', c.id), 30); } }
  } else if (act === 'add-folder') {
    node.open = true;
    if (kind === 'notes') createFolder(node); else createCardFolder(node);
  } else if (act === 'more') {
    openMenu(btn, [
      { label: '重新命名', action: () => startRename(kind, node.id) },
      { label: '移動至…', action: () => openMoveDialog(kind, node) },
      ...(kind === 'notes' ? [{ label: node.type === 'folder' ? '匯出此資料夾（分享用）…' : '匯出此筆記（分享用）…', action: () => exportNode(node) }] : []),
      { label: '刪除（可從回收筒復原）', danger: true, action: () => deleteNode(kind, node) }
    ]);
  }
}

$('#btn-new-doc').addEventListener('click', () => {
  if (sideKind() === 'bookmarks') { $('#btn-bookmark').click(); return; }
  if (sideKind() === 'notes') {
    const f = selectedFolderId ? findNode(selectedFolderId) : null;
    const parent = f && f.node.type === 'folder' ? f.node : null;
    if (parent) parent.open = true;
    createNote(parent);
  } else {
    const f = selectedCFolderId ? findCard(selectedCFolderId) : null;
    if (!f) { toast('請先點選一個卡片資料夾，卡片必須歸入資料夾中'); return; }
    const c = createCard(f.node);
    if (c) { openCard(c.id); setTimeout(() => startRename('cards', c.id), 30); }
  }
});

/* ---------- 建立／刪除／重新命名 ---------- */
function createFolder(parent) {
  const n = { id: uid('folder'), type: 'folder', name: '新資料夾', open: true, children: [] };
  (parent ? parent.children : data.tree).push(n);
  selectedFolderId = n.id;
  renderTree();
  markDirty();
  startRename('notes', n.id);
}

function createNote(parent) {
  commitCurrent();
  const n = { id: uid('note'), type: 'note', name: '未命名筆記' };
  (parent ? parent.children : data.tree).push(n);
  data.notes[n.id] = { html: pageHTML(), comments: {} };
  data.activeId = n.id;
  if (sideKind() !== 'notes') data.ui.sideTab = 'notes';
  renderTree();
  loadNote(n.id);
  markDirty();
  startRename('notes', n.id);
}

function createCardFolder(parent) {
  const f = { id: uid('cf'), type: 'cfolder', name: '新資料夾', open: true, children: [] };
  if (!parent) {
    data.slipbox.tree.push(f);
    selectedCFolderId = f.id;
    afterTreeChange('cards');
    startRename('cards', f.id);
    return;
  }
  if (parent.type !== 'cfolder') { toast('卡片之下不能建立資料夾'); return; }
  const place = () => {
    parent.children.push(f);
    parent.open = true;
    selectedCFolderId = f.id;
    afterTreeChange('cards');
    startRename('cards', f.id);
  };
  if (parent.children.some(c => c.type === 'card')) resolveConflict(parent, f, place);
  else place();
}

function createCard(parent, title) {
  if (!parent) { toast('卡片必須歸入卡片資料夾中'); return null; }
  if (parent.type === 'cfolder' && parent.children.some(c => c.type === 'cfolder')) {
    toast('此資料夾已分子資料夾，卡片必須建立在其中一個子資料夾內', 3500);
    return null;
  }
  const c = { id: uid('card'), type: 'card', title: title || '新卡片', html: '', children: [], open: true };
  parent.children.push(c);
  parent.open = true;
  afterTreeChange('cards');
  return c;
}

function countBadgeRefs(ids) {
  commitCurrent();
  const set = new Set(ids);
  let n = 0;
  const scan = html => {
    if (!html || html.indexOf('card-badge') < 0) return;
    const t = document.createElement('template'); t.innerHTML = html;
    t.content.querySelectorAll('.card-badge').forEach(b => { if (set.has(b.dataset.cardId)) n++; });
  };
  Object.values(data.notes).forEach(x => scan(x.html));
  allCards().forEach(c => { if (!set.has(c.id)) scan(c.html); });
  return n;
}

function deleteNode(kind, node) {
  /* 刪除改為移到資源回收筒，可立即復原或日後從回收筒找回 */
  moveToTrash(kind, node);
}

function startRename(kind, id) {
  if (sideKind() !== kind) { data.ui.sideTab = kind; renderTree(); }
  const row = treeEl.querySelector('.tree-row[data-id="' + id + '"]');
  if (!row) return;
  const nm = row.querySelector('.nm');
  const found = findIn(rootOf(kind), id);
  if (!found) return;
  const old = nodeName(found.node);
  row.draggable = false;
  nm.contentEditable = 'true';
  nm.focus();
  const r = document.createRange(); r.selectNodeContents(nm);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  let cancelled = false;
  const onKey = e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') { e.preventDefault(); nm.blur(); }
    else if (e.key === 'Escape') { cancelled = true; nm.blur(); }
  };
  const onBlur = () => {
    nm.removeEventListener('keydown', onKey);
    nm.removeEventListener('blur', onBlur);
    nm.removeAttribute('contenteditable');
    const name = nm.textContent.replace(/\s+/g, ' ').trim();
    if (!cancelled && name && name !== old) {
      setNodeName(found.node, name);
      if (kind === 'cards') { syncBadges(); if (drawerCardId) renderDrawer(); }
      markDirty();
    }
    renderTree();
    updateTitle();
  };
  nm.addEventListener('keydown', onKey);
  nm.addEventListener('blur', onBlur);
}

function afterTreeChange(kind) {
  if (kind === 'cards') { syncBadges(); if (drawerCardId) renderDrawer(); }
  renderTree();
  markDirty();
}

/* ---------- 卡片盒階層規則 ---------- */
function cardPlaceCheck(node, parent) {
  if (!parent) return node.type === 'cfolder' ? 'ok' : '卡片必須放在卡片資料夾內';
  if (parent.type === 'card') return node.type === 'card' ? 'ok' : '資料夾不能放進卡片之下';
  const others = parent.children.filter(c => c !== node);
  if (node.type === 'card') return others.some(c => c.type === 'cfolder') ? '此資料夾已分子資料夾，卡片必須放入其中一個子資料夾' : 'ok';
  return others.some(c => c.type === 'card') ? 'conflict' : 'ok';
}

function resolveConflict(parent, newFolder, place) {
  computeCardNos();
  const cards = parent.children.filter(c => c.type === 'card');
  const canHoldCards = !newFolder.children.some(c => c.type === 'cfolder');
  const box = document.createElement('div');
  box.innerHTML =
    '<p>資料夾「' + hesc(cardLabel(parent)) + '」內已有 ' + cards.length + ' 張卡片。依卡片盒規則，<b>子資料夾與卡片不可並列於同一層</b>，請選擇重構方式：</p>' +
    '<label class="opt"><input type="radio" name="cf-mode" value="A" checked> <b>方案 A：自動封裝</b><br>' +
    '<span style="font-size:12.5px;color:#64748b">自動建立過渡子資料夾，將既有卡片全部收入其中，空出本層給新的子資料夾。</span>' +
    '<label class="fl">過渡子資料夾名稱</label><input type="text" id="cf-wrap" value="一般概念"></label>' +
    '<label class="opt"><input type="radio" name="cf-mode" value="B"> <b>方案 B：手動重新規劃</b><br>' +
    '<span style="font-size:12.5px;color:#64748b">逐一指定既有卡片要歸入哪個子資料夾；可另外新增子資料夾（以逗號或頓號分隔）。</span>' +
    '<label class="fl">另外新增的子資料夾</label><input type="text" id="cf-extra" placeholder="例如：民法總則、債法總論">' +
    '<div id="cf-assign" style="margin-top:8px"></div></label>';
  const extraNames = () => (box.querySelector('#cf-extra').value || '').split(/[,，、]/).map(s => s.trim()).filter(Boolean);
  const renderAssign = () => {
    const targets = [];
    if (canHoldCards) targets.push(newFolder.name + '（新子資料夾）');
    extraNames().forEach(n => targets.push(n));
    const area = box.querySelector('#cf-assign');
    const prev = [...area.querySelectorAll('select')].map(s => s.value);
    area.innerHTML = targets.length ? cards.map((c, i) =>
      '<div class="assign-row"><span>' + hesc(cardLabel(c)) + '</span><select data-i="' + i + '">' +
      targets.map((t, j) => '<option value="' + j + '">' + hesc(t) + '</option>').join('') + '</select></div>').join('')
      : '<div style="color:#94a3b8;font-size:12.5px">請先輸入至少一個可放卡片的子資料夾名稱。</div>';
    area.querySelectorAll('select').forEach((s, i) => { if (prev[i] && s.querySelector('option[value="' + prev[i] + '"]')) s.value = prev[i]; });
  };
  box.querySelector('#cf-extra').addEventListener('input', renderAssign);
  box.addEventListener('focusin', e => { if (e.target.id === 'cf-extra') box.querySelector('input[value="B"]').checked = true; });
  renderAssign();
  openDialog({
    title: '階層衝突：子資料夾與卡片不可並列',
    body: box,
    buttons: [
      { label: '取消' },
      {
        label: '確定', primary: true, action: () => {
          const mode = box.querySelector('input[name="cf-mode"]:checked').value;
          if (mode === 'A') {
            const name = box.querySelector('#cf-wrap').value.trim() || '一般概念';
            const wrapper = { id: uid('cf'), type: 'cfolder', name, open: true, children: cards };
            parent.children = parent.children.filter(c => c.type !== 'card');
            parent.children.unshift(wrapper);
            place();
            return true;
          }
          const extras = extraNames().map(n => ({ id: uid('cf'), type: 'cfolder', name: n, open: true, children: [] }));
          const targets = [];
          if (canHoldCards) targets.push(newFolder);
          extras.forEach(x => targets.push(x));
          if (!targets.length) { toast('請先輸入可放卡片的子資料夾名稱'); return false; }
          const sels = [...box.querySelectorAll('#cf-assign select')];
          cards.forEach((c, i) => { const t = targets[+(sels[i] ? sels[i].value : 0)] || targets[0]; t.children.push(c); });
          parent.children = parent.children.filter(c => c.type !== 'card');
          extras.forEach(x => parent.children.push(x));
          place();
          return true;
        }
      }
    ]
  });
}

/* ---------- 移動（拖曳與選單共用） ---------- */
function doMove(kind, node, parent, refNode, pos) {
  const f = findIn(rootOf(kind), node.id);
  if (f) f.list.splice(f.index, 1);
  const list = parent ? parent.children : rootOf(kind);
  let index = list.length;
  if (refNode && (pos === 'before' || pos === 'after')) {
    const i = list.indexOf(refNode);
    if (i >= 0) index = i + (pos === 'after' ? 1 : 0);
  }
  list.splice(index, 0, node);
  if (parent) parent.open = true;
  afterTreeChange(kind);
}

function requestMove(kind, node, target, pos) {
  let parent;
  if (pos === 'root') parent = null;
  else if (pos === 'inside') parent = target;
  else { if (target === node) return; const f = findIn(rootOf(kind), target.id); parent = f ? f.parent : null; }
  if (parent === node || (parent && isDescendant(node, parent))) { toast('不能移入自己或自己的下層'); return; }
  const ref = (pos === 'before' || pos === 'after') ? target : null;
  if (kind === 'notes') {
    if (parent && parent.type !== 'folder') { toast('筆記之下不能再放入項目'); return; }
    doMove(kind, node, parent, ref, pos);
    return;
  }
  const chk = cardPlaceCheck(node, parent);
  if (chk === 'ok') { doMove(kind, node, parent, ref, pos); return; }
  if (chk === 'conflict') { resolveConflict(parent, node, () => doMove(kind, node, parent, ref, pos)); return; }
  toast(chk, 3500);
}

/* HTML5 原生拖曳 */
let dragInfo = null, dropTarget = null;
function clearDropMarks() {
  treeEl.querySelectorAll('.drop-inside').forEach(r => r.classList.remove('drop-inside'));
  dropLine.style.display = 'none';
}
treeEl.addEventListener('dragstart', e => {
  const row = e.target.closest('.tree-row');
  if (!row || sideKind() === 'bookmarks') return;
  dragInfo = { kind: sideKind(), id: row.dataset.id };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', row.dataset.id);
  row.classList.add('dragging');
});
treeEl.addEventListener('dragend', () => {
  treeEl.querySelectorAll('.dragging').forEach(r => r.classList.remove('dragging'));
  clearDropMarks();
  dragInfo = null; dropTarget = null;
});
treeEl.addEventListener('dragover', e => {
  if (!dragInfo) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  clearDropMarks();
  const row = e.target.closest('.tree-row');
  const kind = dragInfo.kind;
  if (!row) {
    const last = [...treeEl.querySelectorAll(':scope > li > .tree-row')].pop();
    if (last) {
      dropLine.style.display = 'block';
      dropLine.style.top = (treeEl.scrollHeight - 38) + 'px';
      dropLine.style.left = '12px'; dropLine.style.right = '8px';
    }
    dropTarget = { node: null, pos: 'root' };
    return;
  }
  if (row.dataset.id === dragInfo.id) { dropTarget = null; return; }
  const found = findIn(rootOf(kind), row.dataset.id);
  if (!found) return;
  const target = found.node;
  const container = kind === 'notes' ? target.type === 'folder' : true;
  const rect = row.getBoundingClientRect();
  const y = e.clientY - rect.top, h = rect.height;
  let pos;
  if (container) pos = y < h * 0.28 ? 'before' : (y > h * 0.72 ? 'after' : 'inside');
  else pos = y < h / 2 ? 'before' : 'after';
  if (pos === 'inside') row.classList.add('drop-inside');
  else {
    dropLine.style.display = 'block';
    dropLine.style.top = (row.offsetTop + (pos === 'after' ? row.offsetHeight : 0) - 1) + 'px';
    dropLine.style.left = (parseInt(row.style.paddingLeft, 10) + 16) + 'px';
    dropLine.style.right = '8px';
  }
  dropTarget = { node: target, pos };
});
treeEl.addEventListener('dragleave', e => { if (!treeEl.contains(e.relatedTarget)) clearDropMarks(); });
treeEl.addEventListener('drop', e => {
  e.preventDefault();
  clearDropMarks();
  if (!dragInfo || !dropTarget) return;
  const f = findIn(rootOf(dragInfo.kind), dragInfo.id);
  if (f) requestMove(dragInfo.kind, f.node, dropTarget.node, dropTarget.pos);
  dragInfo = null; dropTarget = null;
});

/* 點選移動（Click-to-Move） */
function openMoveDialog(kind, node) {
  if (kind === 'cards') computeCardNos();
  const items = [];
  const rootOk = kind === 'notes' || node.type === 'cfolder';
  items.push({ label: '（最上層）', depth: 0, target: null, ok: rootOk });
  const walk = (nodes, depth) => nodes.forEach(n => {
    if (n === node) return;
    if (kind === 'notes') {
      if (n.type !== 'folder') return;
      items.push({ label: n.name, depth, target: n, ok: true });
      walk(n.children, depth + 1);
    } else {
      const chk = cardPlaceCheck(node, n);
      items.push({ label: cardLabel(n), depth, target: n, ok: chk === 'ok' || chk === 'conflict', card: n.type === 'card' });
      walk(n.children, depth + 1);
    }
  });
  walk(rootOf(kind), 1);
  const box = document.createElement('div');
  box.innerHTML = '<p style="margin:0 0 6px">將「' + hesc(kind === 'cards' ? cardLabel(node) : nodeName(node)) + '」移入：</p><div class="pick-list"></div>';
  const list = box.querySelector('.pick-list');
  let chosen = undefined;
  items.forEach(it => {
    const d = document.createElement('div');
    d.className = 'pick-item' + (it.ok ? '' : ' dis');
    d.style.paddingLeft = (10 + it.depth * 16) + 'px';
    d.innerHTML = (it.target ? (kind === 'notes' ? '📁 ' : (it.card ? '🗒 ' : '🗂 ')) : '') + hesc(it.label) + (it.card ? '<span style="color:#94a3b8">（作為下層卡片）</span>' : '');
    if (it.ok) d.addEventListener('click', () => { list.querySelectorAll('.on').forEach(x => x.classList.remove('on')); d.classList.add('on'); chosen = it.target; });
    list.appendChild(d);
  });
  openDialog({
    title: '移動至…', body: box,
    buttons: [{ label: '取消' }, {
      label: '移動', primary: true, action: () => {
        if (chosen === undefined) { toast('請先點選目標資料夾'); return false; }
        if (chosen === null) requestMove(kind, node, null, 'root');
        else requestMove(kind, node, chosen, 'inside');
        return true;
      }
    }]
  });
}

/* =========================================================
   筆記載入、切換與暫存
   ========================================================= */
function activeNoteName() {
  const f = data.activeId ? findNode(data.activeId) : null;
  return f ? f.node.name : '';
}
function updateTitle() {
  const n = activeNoteName();
  document.title = n ? n + ' — ' + APP_TITLE : APP_TITLE;
}

function commitCurrent() {
  const id = data && data.activeId;
  if (!id || !data.notes[id] || !pagesEl.querySelector('.a4-page')) return;
  renumberFootnotes();
  const clone = pagesEl.cloneNode(true);
  clone.querySelectorAll('.active,.flash,.cell-sel,.col-resize,.sel,.td-allsel,.rz-e,.rz-s,.rz-se,.del-pending').forEach(e => { e.classList.remove('active', 'flash', 'cell-sel', 'col-resize', 'sel', 'td-allsel', 'rz-e', 'rz-s', 'rz-se', 'del-pending'); });
  const comments = {};
  railEl.querySelectorAll('.comment-bubble').forEach(b => {
    const cid = b.dataset.commentId;
    if (pagesEl.querySelector('.comment-target[data-comment-id="' + cid + '"]')) comments[cid] = b.querySelector('.cb-body').innerHTML;
  });
  data.notes[id].html = clone.innerHTML;
  data.notes[id].comments = comments;
}

function loadNote(id) {
  flushSnapshot();
  const note = data.notes[id];
  if (!note) { showEmptyState(); return; }
  data.activeId = id;
  clearCellSel();
  pagesEl.innerHTML = note.html || pageHTML();
  if (!pagesEl.querySelector('.a4-page')) pagesEl.innerHTML = pageHTML();
  migrateFonts(pagesEl);
  ensureControls(pagesEl);
  railEl.innerHTML = '';
  Object.entries(note.comments || {}).forEach(([cid, html]) => {
    if (pagesEl.querySelector('.comment-target[data-comment-id="' + cid + '"]')) createBubble(cid, html);
  });
  savedRange = null;
  hideCtxBar();
  computeCardNos();
  updateBadgesIn(pagesEl);
  clearTreeAllSel();
  renumberFootnotes();
  layoutAllTrees();
  updateTitle();
  workspace.scrollTop = 0;
  applyOutline();
  reflowAll();
  updateWordCount();
  if (!findBar.hidden) runFind();
  scheduleLayout();
  ensureBaseSnapshot();
}

function switchNote(id) {
  if (id === data.activeId) return;
  commitCurrent();
  loadNote(id);
  renderTree();
}

function showEmptyState() {
  data.activeId = null;
  railEl.innerHTML = '';
  svgEl.innerHTML = '';
  hideCtxBar();
  pagesEl.innerHTML = '<div class="empty-state"><div>目前沒有開啟中的筆記。</div><button type="button" data-act="empty-new">新增筆記</button></div>';
  updateTitle();
}
pagesEl.addEventListener('click', e => {
  if (e.target.closest('[data-act="empty-new"]')) {
    const f = selectedFolderId ? findNode(selectedFolderId) : null;
    createNote(f && f.node.type === 'folder' ? f.node : null);
  }
});

/* =========================================================
   選取範圍管理
   ========================================================= */
function isEditable(node) {
  const el = elOf(node);
  return !!el && el.isContentEditable && !!el.closest('#pages, #comment-rail, #card-drawer');
}
function getHost(node) {
  let el = elOf(node);
  el = el && el.closest('[contenteditable="true"]');
  while (el && el.parentElement) {
    const up = el.parentElement.closest('[contenteditable]');
    if (!up || up.getAttribute('contenteditable') !== 'true') break;
    el = up;
  }
  return el;
}
function currentRange() {
  const sel = getSelection();
  let r = null;
  if (sel.rangeCount && isEditable(sel.getRangeAt(0).startContainer)) r = sel.getRangeAt(0).cloneRange();
  else if (savedRange && savedRange.startContainer.isConnected && isEditable(savedRange.startContainer)) r = savedRange.cloneRange();
  if (!r) return null;
  const host = getHost(r.startContainer);
  if (host && document.activeElement !== host) host.focus({ preventScroll: true });
  sel.removeAllRanges();
  sel.addRange(r);
  return sel.getRangeAt(0);
}
function placeCaret(el, selectAll) {
  const host = getHost(el);
  if (host) host.focus({ preventScroll: true });
  const r = document.createRange();
  r.selectNodeContents(el);
  if (!selectAll) r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  savedRange = r.cloneRange();
}
function getBlocks(range) {
  const el = elOf(range.commonAncestorContainer);
  if (!el) return [];
  const leaf = el.closest('.fn-text, .cb-body, .quote-source, .td-box, .td-note, .cd-title, .fold-title');
  if (leaf) return [leaf];
  const cont = el.closest('td, th, .quote-text, .fold-b, .page-body, .cd-body');
  if (!cont) return [];
  let blk = el;
  while (blk && blk !== cont && blk.parentElement !== cont) blk = blk.parentElement;
  if (blk && blk !== cont) return [blk];
  const kids = [...cont.children].filter(c => range.intersectsNode(c) && !c.classList.contains('page-break'));
  return kids.length ? kids : [cont];
}
function topBlock(node, body) {
  let el = elOf(node);
  if (el === body) return null;
  while (el && el.parentElement !== body) el = el.parentElement;
  return el;
}

document.addEventListener('selectionchange', () => {
  const sel = getSelection();
  if (sel.rangeCount && isEditable(sel.anchorNode)) {
    savedRange = sel.getRangeAt(0).cloneRange();
    updateToolbarState();
    updateCtxBar();
  }
});

function updateToolbarState() {
  const sel = getSelection();
  if (!sel.rangeCount) return;
  const el = elOf(sel.anchorNode);
  if (!el || !isEditable(el)) return;
  try {
    $('#btn-bold').classList.toggle('active', document.queryCommandState('bold'));
    $('#btn-underline').classList.toggle('active', document.queryCommandState('underline'));
  } catch (_) { /* 部分瀏覽器不支援 */ }
  $('#btn-hl').classList.toggle('active', !!el.closest('span.hl'));
  $('#btn-quote').classList.toggle('active', !!el.closest('.quote, .quote-block'));
  const h = el.closest('h1,h2,h3,h4,h5,h6');
  $('#sel-block').value = h ? (h.dataset.lv ? 'l' + h.dataset.lv : h.tagName.toLowerCase()) : 'p';
  const lhEl = el.closest('[style*="line-height"]');
  const lh = lhEl ? parseFloat(lhEl.style.lineHeight) : 1.5;
  const match = LINE_HEIGHTS.find(v => parseFloat(v) === lh);
  $('#sel-lh').value = match || '';
  const cs = getComputedStyle(el);
  const pt = Math.round(parseFloat(cs.fontSize) * 0.75);
  $('#sel-size').value = FONT_SIZES.includes(pt) ? String(pt) : '';
  $('#sel-font').value = fontKeyFromFamily(cs.fontFamily);
  const hex = '#' + rgbToHex(cs.color);
  document.querySelectorAll('#swatches .sw').forEach(s => s.classList.toggle('active', s.dataset.color.toUpperCase() === hex));
  const ta = cs.textAlign;
  const a = ta === 'center' ? 'center' : (ta === 'right' || ta === 'end') ? 'right' : ta === 'justify' ? 'justify' : 'left';

}

/* =========================================================
   樣式套用核心（Range API 精準包覆）
   ========================================================= */
function applyInline(props, r) {
  if (r.collapsed) {
    getBlocks(r).forEach(b => {
      Object.assign(b.style, props);
      b.querySelectorAll('[style]').forEach(d => {
        if (d.classList.contains('td-box') || d.classList.contains('td-note') || d.classList.contains('tree-diagram') || d.tagName === 'COL') return;
        Object.keys(props).forEach(k => { d.style[k] = ''; });
        if (!d.getAttribute('style')) d.removeAttribute('style');
      });
    });
    return;
  }
  let sc = r.startContainer, so = r.startOffset, ec = r.endContainer, eo = r.endOffset;
  if (ec.nodeType === 3 && eo > 0 && eo < ec.length) ec.splitText(eo);
  if (sc.nodeType === 3 && so > 0 && so < sc.length) {
    const nt = sc.splitText(so);
    if (ec === sc) { ec = nt; eo = eo - so; }
    sc = nt; so = 0;
  }
  const nr = document.createRange();
  nr.setStart(sc, so); nr.setEnd(ec, eo);
  const exclude = new Set();
  if (sc.nodeType === 3 && so >= sc.length) exclude.add(sc);
  if (ec.nodeType === 3 && eo === 0) exclude.add(ec);
  const root = nr.commonAncestorContainer;
  const nodes = [];
  if (root.nodeType === 3) nodes.push(root);
  else {
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let t;
    while ((t = tw.nextNode())) { if (nr.intersectsNode(t)) nodes.push(t); }
  }
  const targets = nodes.filter(t => {
    if (!t.length || exclude.has(t)) return false;
    const p = t.parentElement;
    if (!p || !p.isContentEditable) return false;
    if (!t.textContent.trim() && getComputedStyle(p).display !== 'inline') return false;
    return true;
  });
  targets.forEach(t => {
    const p = t.parentElement;
    let s;
    if (p.tagName === 'SPAN' && !p.className && p.childNodes.length === 1) s = p;
    else { s = document.createElement('span'); p.insertBefore(s, t); s.appendChild(t); }
    Object.assign(s.style, props);
  });
  if (targets.length) {
    const rr = document.createRange();
    const last = targets[targets.length - 1];
    rr.setStart(targets[0], 0); rr.setEnd(last, last.length);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rr);
    savedRange = rr.cloneRange();
  }
}

function applyMarker(color, factory) {
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('hiliteColor', false, color);
  document.execCommand('styleWithCSS', false, false);
  const hits = [...document.querySelectorAll('#pages [style], #card-drawer [style]')].filter(el => el.style.backgroundColor === color);
  hits.forEach(el => {
    el.style.backgroundColor = '';
    const w = factory();
    if (el.tagName === 'SPAN' && !el.style.cssText.trim() && !el.className) {
      while (el.firstChild) w.appendChild(el.firstChild);
      el.replaceWith(w);
    } else {
      while (el.firstChild) w.appendChild(el.firstChild);
      el.appendChild(w);
      if (!el.style.cssText.trim()) el.removeAttribute('style');
    }
  });
  return hits.length;
}

function insertBlockAtCaret(node) {
  const r = needRange('請先將游標置於本文中要插入的位置'); if (!r) return false;
  const el = elOf(r.startContainer);
  const body = el.closest('.page-body');
  if (!body) { toast('僅能插入於本文區'); return false; }
  if (el.closest('.quote-block, .tree-diagram, table')) { toast('請先將游標移到一般段落中再插入'); return false; }
  const blk = topBlock(r.startContainer, body);
  if (blk && blk.classList.contains('page-break')) blk.before(node);
  else if (blk && blk.tagName === 'P' && isEmptyBlock(blk)) blk.replaceWith(node);
  else if (blk) blk.after(node);
  else body.appendChild(node);
  const next = node.nextElementSibling;
  if (!next || next.classList.contains('page-break') || !/^(P|H1|H2|H3)$/.test(next.tagName)) {
    const p = document.createElement('p'); p.innerHTML = '<br>'; node.after(p);

  return true;
}

/* =========================================================

function insertTable(rows, cols) {
  const t = document.createElement('table');
  t.className = 'doc-table';
  const cg = document.createElement('colgroup');
  for (let j = 0; j < cols; j++) { const col = document.createElement('col'); col.style.width = (100 / cols).toFixed(3) + '%'; cg.appendChild(col); }
  t.appendChild(cg);
  const tb = document.createElement('tbody');
  for (let i = 0; i < rows; i++) {
    const tr = document.createElement('tr');
    for (let j = 0; j < cols; j++) { const td = document.createElement('td'); td.innerHTML = '<br>'; tr.appendChild(td); }
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  if (!insertBlockAtCaret(t)) return;
  placeCaret(t.querySelector('td'), false);
  markDirty(); scheduleLayout(); updateCtxBar();
}

function buildGrid(table) {
  const grid = [], info = new Map();
  [...table.rows].forEach((tr, r) => {
    grid[r] = grid[r] || [];
    let c = 0;
    [...tr.cells].forEach(td => {
      while (grid[r][c]) c++;
      const rs = Math.max(1, td.rowSpan || 1), cs = Math.max(1, td.colSpan || 1);
      info.set(td, { r0: r, c0: c, rs, cs });
      for (let i = 0; i < rs; i++) for (let j = 0; j < cs; j++) { grid[r + i] = grid[r + i] || []; grid[r + i][c + j] = td; }
      c += cs;
    });
  });
  const ncol = Math.max(1, ...grid.map(row => row ? row.length : 0));
  return { grid, info, ncol, nrow: table.rows.length };
}
function ensureColgroup(table) {
  const { ncol } = buildGrid(table);
  let cg = table.querySelector(':scope > colgroup');
  if (!cg || cg.children.length !== ncol) {
    const old = cg ? [...cg.children].map(c => parseFloat(c.style.width) || 0) : [];
    if (cg) cg.remove();
    cg = document.createElement('colgroup');
    const ws = old.length === ncol ? old : Array(ncol).fill(100 / ncol);
    ws.forEach(w => { const col = document.createElement('col'); col.style.width = w.toFixed(3) + '%'; cg.appendChild(col); });
    table.prepend(cg);
  }
  return [...cg.children];
}
function colWidths(table) { return ensureColgroup(table).map(c => parseFloat(c.style.width) || 0); }
function rebuildColgroup(table, ws) {
  const old = table.querySelector(':scope > colgroup');
  if (old) old.remove();
  const sum = ws.reduce((a, b) => a + b, 0) || 1;
  const cg = document.createElement('colgroup');
  ws.forEach(w => { const col = document.createElement('col'); col.style.width = (w / sum * 100).toFixed(3) + '%'; cg.appendChild(col); });
  table.prepend(cg);
}

function currentCell() {
  const sel = getSelection();
  let n = sel.rangeCount && isEditable(sel.anchorNode) ? sel.anchorNode : (savedRange && savedRange.startContainer.isConnected ? savedRange.startContainer : null);
  const c = n && elOf(n).closest('td, th');
  return c && c.closest('#pages table.doc-table') ? c : null;
}
function newCell(tag, cs) {
  const n = document.createElement(tag === 'TH' ? 'th' : 'td');
  n.innerHTML = '<br>';
  if (cs > 1) n.colSpan = cs;
  return n;
}

function rectCells(table, a, b) {
  const { grid, info } = buildGrid(table);
  const ia = info.get(a), ib = info.get(b);
  let r1 = Math.min(ia.r0, ib.r0), c1 = Math.min(ia.c0, ib.c0);
  let r2 = Math.max(ia.r0 + ia.rs - 1, ib.r0 + ib.rs - 1), c2 = Math.max(ia.c0 + ia.cs - 1, ib.c0 + ib.cs - 1);
  let changed = true;
  while (changed) {
    changed = false;
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) {
      const x = grid[r] && grid[r][c]; if (!x) continue;
      const xi = info.get(x);
      if (xi.r0 < r1) { r1 = xi.r0; changed = true; }
      if (xi.c0 < c1) { c1 = xi.c0; changed = true; }
      if (xi.r0 + xi.rs - 1 > r2) { r2 = xi.r0 + xi.rs - 1; changed = true; }
      if (xi.c0 + xi.cs - 1 > c2) { c2 = xi.c0 + xi.cs - 1; changed = true; }
    }
  }
  const cells = new Set();
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) { const x = grid[r] && grid[r][c]; if (x) cells.add(x); }

}
function clearCellSel() {
